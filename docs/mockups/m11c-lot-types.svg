<text x="24" y="34" fill="#f0d9b0" font-size="19" font-weight="700">M11c Grundstückstypen Köpenick · Draufsicht 18 × 15 m, Straße unten</text>
<text x="24" y="54" fill="#b5aa98" font-size="12">Je Gebiet zwei Typen, die es nur dort gibt. Ersetzen einzelne Bauplätze an der Straße (etwa jeder fünfte), Begehbares offen, Kanten mit Mauer, Zaun oder Hecke.</text>
