<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Barlow Condensed, Arial Narrow, sans-serif">
  <rect width="1120" height="520" fill="#14100c"/>
  <text x="20" y="30" fill="#e9a23b" font-size="20" font-weight="700">Funde (2D #14, #27): zwei Spuren pro Bezirk</text>
  <text x="20" y="52" fill="#9a8f80" font-size="14">Uhrwerkteile = Kraft (5 je Bezirk, dauerhaft). Kassetten = Geschichte (3 je Bezirk, keine Kraft). Beide versteckt in Sackgassen, Hinterhöfen, Seitengassen.</text>

  <!-- World view -->
  <g transform="translate(20,72)">
    <rect width="340" height="430" rx="6" fill="#1b1d18" stroke="#4c453a"/>
    <text x="14" y="24" fill="#9a8f80" font-size="13" letter-spacing="1">IN DER WELT</text>
    <rect x="30" y="60" width="120" height="160" fill="#2c2a25"/><rect x="190" y="60" width="120" height="160" fill="#2c2a25"/>
    <rect x="150" y="60" width="40" height="160" fill="#22241f"/>
    <circle cx="170" cy="96" r="22" fill="#c9a34a" opacity=".15"/><circle cx="170" cy="96" r="9" fill="none" stroke="#c9a34a" stroke-width="2"/>
    <g stroke="#c9a34a" stroke-width="2"><line x1="170" y1="83" x2="170" y2="86"/><line x1="170" y1="106" x2="170" y2="109"/><line x1="157" y1="96" x2="160" y2="96"/><line x1="180" y1="96" x2="183" y2="96"/></g>
    <text x="170" y="138" fill="#c9a34a" font-size="13" text-anchor="middle">Uhrwerkteil</text>
    <text x="170" y="152" fill="#6f665a" font-size="12" text-anchor="middle">goldener Schimmer, tickt</text>
    <rect x="60" y="262" width="26" height="16" rx="2" fill="#3a3530" stroke="#cfc4b4"/><circle cx="68" cy="270" r="3" fill="none" stroke="#cfc4b4"/><circle cx="78" cy="270" r="3" fill="none" stroke="#cfc4b4"/>
    <text x="96" y="275" fill="#cfc4b4" font-size="13">Kassette auf Mauerrest</text>
    <text x="96" y="291" fill="#6f665a" font-size="12">kurzes Rauschen in der Nähe</text>
    <rect x="30" y="320" width="280" height="56" rx="4" fill="#0e0b08" stroke="#c9a34a" stroke-opacity=".6"/>
    <text x="44" y="342" fill="#c9a34a" font-size="15" font-weight="700">Uhrwerkteil 3 von 5 · Köpenick</text>
    <text x="44" y="362" fill="#cfc4b4" font-size="13">+1 % Schaden, für immer</text>
    <text x="14" y="408" fill="#6f665a" font-size="12">Aufheben im Vorbeilaufen, Banner wie beim Segen.</text>
  </g>

  <!-- Kodex section -->
  <g transform="translate(380,72)">
    <rect width="720" height="430" rx="6" fill="#1d1712" stroke="#4c453a"/>
    <text x="16" y="24" fill="#9a8f80" font-size="13" letter-spacing="1">KODEX › FUNDE (neuer Abschnitt unter Endgegner)</text>
    <text x="16" y="54" fill="#e8dccb" font-size="17" font-weight="700">Köpenick · Urzeit</text>
    <g transform="translate(16,66)">
      <g fill="none" stroke-width="2">
        <circle cx="14" cy="14" r="11" stroke="#c9a34a"/><circle cx="44" cy="14" r="11" stroke="#c9a34a"/><circle cx="74" cy="14" r="11" stroke="#c9a34a"/>
        <circle cx="104" cy="14" r="11" stroke="#4c453a" stroke-dasharray="3 3"/><circle cx="134" cy="14" r="11" stroke="#4c453a" stroke-dasharray="3 3"/>
      </g>
      <text x="160" y="19" fill="#cfc4b4" font-size="14">3 von 5 Uhrwerkteilen · +2 % Schaden, +5 Leben</text>
      <text x="0" y="48" fill="#6f665a" font-size="13">Alle 5: Bezirksbonus „Urzeit-Instinkt“ (+10 % Schaden gegen Dinos)</text>
    </g>
    <g transform="translate(16,140)">
      <rect width="688" height="50" rx="4" fill="#120d0a" stroke="#4c453a"/>
      <text x="14" y="21" fill="#e8dccb" font-size="15" font-weight="700">Kassette 1 · „Zeitnormal, Probebetrieb“</text>
      <text x="14" y="40" fill="#9a8f80" font-size="13">„Sender Köpenick meldet Abweichung. Uhren laufen rückwärts. Bitte bestätigen.“</text>
      <rect y="58" width="688" height="50" rx="4" fill="#120d0a" stroke="#4c453a"/>
      <text x="14" y="79" fill="#e8dccb" font-size="15" font-weight="700">Kassette 2 · „Hauptmann“</text>
      <text x="14" y="98" fill="#9a8f80" font-size="13">„Er trägt eine Uniform von 1906 und gibt Befehle. Die Toten gehorchen.“</text>
      <rect y="116" width="688" height="36" rx="4" fill="none" stroke="#4c453a" stroke-dasharray="4 4"/>
      <text x="14" y="139" fill="#6f665a" font-size="14">??? · noch nicht gefunden</text>
    </g>
    <text x="16" y="330" fill="#e8dccb" font-size="17" font-weight="700" opacity=".5">Xhain · 1981</text>
    <text x="16" y="352" fill="#6f665a" font-size="14">0 von 5 · 0 von 3</text>
    <text x="16" y="400" fill="#6f665a" font-size="13">Werte: Vorschlag aus 2D #27. Texte: Entwurf von Claude, ersetzbar.</text>
  </g>
</svg>
