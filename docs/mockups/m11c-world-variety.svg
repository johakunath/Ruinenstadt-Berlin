<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, Arial, sans-serif"><rect width="960" height="720" fill="#0e1517"/><text x="20" y="32" fill="#f0d9b0" font-size="19" font-weight="700">M11c Weltvielfalt Köpenick · zwei eigene Grundstückstypen pro Gebiet, drei Wetter-Varianten</text><rect x="20" y="56" width="220" height="220" rx="6" fill="#171f20" stroke="#9c7a5c" stroke-width="2"/><text x="32" y="80" fill="#ef9f27" font-size="14" font-weight="700">Bahnhofsviertel</text><rect x="32" y="96" width="196" height="76" rx="4" fill="#202520"/><text x="42" y="118" fill="#ead9c0" font-size="13" font-weight="700">Hinterhof</text><foreignObject x="42" y="124" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Altbau-Hof mit Mülltonnen, Wäscheleinen, Fahrradständer</div></foreignObject><rect x="32" y="184" width="196" height="76" rx="4" fill="#202520"/><text x="42" y="206" fill="#ead9c0" font-size="13" font-weight="700">Parkplatz</text><foreignObject x="42" y="212" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Abgestellte Autos, Schranke, Ticketautomat</div></foreignObject><rect x="252" y="56" width="220" height="220" rx="6" fill="#171f20" stroke="#3d5a2c" stroke-width="2"/><text x="264" y="80" fill="#ef9f27" font-size="14" font-weight="700">Müggelberge</text><rect x="264" y="96" width="196" height="76" rx="4" fill="#202520"/><text x="274" y="118" fill="#ead9c0" font-size="13" font-weight="700">Kleingärten</text><foreignObject x="274" y="124" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Lauben, Zäune, Beete, Gartenzwerge</div></foreignObject><rect x="264" y="184" width="196" height="76" rx="4" fill="#202520"/><text x="274" y="206" fill="#ead9c0" font-size="13" font-weight="700">Teich im Park</text><foreignObject x="274" y="212" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Steg, Schilf, Bank am Wasser</div></foreignObject><rect x="484" y="56" width="220" height="220" rx="6" fill="#171f20" stroke="#4f7a35" stroke-width="2"/><text x="496" y="80" fill="#ef9f27" font-size="14" font-weight="700">Spreepark</text><rect x="496" y="96" width="196" height="76" rx="4" fill="#202520"/><text x="506" y="118" fill="#ead9c0" font-size="13" font-weight="700">Trümmerfeld</text><foreignObject x="506" y="124" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Schuttberge, Betonplatten, rostige Träger</div></foreignObject><rect x="496" y="184" width="196" height="76" rx="4" fill="#202520"/><text x="506" y="206" fill="#ead9c0" font-size="13" font-weight="700">Baustelle mit Kran</text><foreignObject x="506" y="212" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Kran, Bauzaun, Container, Gerüst</div></foreignObject><rect x="716" y="56" width="220" height="220" rx="6" fill="#171f20" stroke="#b08a4a" stroke-width="2"/><text x="728" y="80" fill="#ef9f27" font-size="14" font-weight="700">Rathaus / Altstadt</text><rect x="728" y="96" width="196" height="76" rx="4" fill="#202520"/><text x="738" y="118" fill="#ead9c0" font-size="13" font-weight="700">Markt</text><foreignObject x="738" y="124" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Stände, Planen, Kisten, Lichterketten</div></foreignObject><rect x="728" y="184" width="196" height="76" rx="4" fill="#202520"/><text x="738" y="206" fill="#ead9c0" font-size="13" font-weight="700">Kirchhof</text><foreignObject x="738" y="212" width="180" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#b5aa98;font:11px Inter,Arial">Gräber, Mauer, Linden (St. Laurentius)</div></foreignObject><text x="20" y="306" fill="#b5aa98" font-size="12">Dazu überall: Graffiti, Pfützen, Gebietsname beim Betreten (2D-Meldung). Wetterteilchen ohne zusätzliche Lichter (Leistung: ein Partikelsystem).</text><rect x="20" y="340" width="920" height="104" rx="6" fill="#171f20"/><text x="36" y="366" fill="#ef9f27" font-size="15" font-weight="700">A · Wetter pro Gebiet fest</text><text x="36" y="386" fill="#b5aa98" font-size="12">Bahnhof Regen · Müggelberge Nebel + Glühwürmchen · Spreepark Asche + Glut · Rathaus klarer Mond</text><rect x="36" y="396" width="96" height="40" rx="4" fill="#0e1517" stroke="#3a342c"/><path d="M52 406 l-4 12" stroke="#7dd3ff" stroke-width="1.6"/><path d="M64 414 l-4 12" stroke="#7dd3ff" stroke-width="1.6"/><path d="M76 422 l-4 12" stroke="#7dd3ff" stroke-width="1.6"/><path d="M88 406 l-4 12" stroke="#7dd3ff" stroke-width="1.6"/><path d="M100 414 l-4 12" stroke="#7dd3ff" stroke-width="1.6"/><path d="M112 422 l-4 12" stroke="#7dd3ff" stroke-width="1.6"/><rect x="146" y="396" width="96" height="40" rx="4" fill="#0e1517" stroke="#3a342c"/><rect x="154" y="410" width="80" height="10" rx="5" fill="#cfd8dc" opacity=".35"/><rect x="164" y="424" width="70" height="9" rx="5" fill="#cfd8dc" opacity=".3"/><circle cx="169" cy="408" r="2" fill="#f2d14b"/><circle cx="186" cy="428" r="2" fill="#f2d14b"/><circle cx="203" cy="408" r="2" fill="#f2d14b"/><circle cx="220" cy="428" r="2" fill="#f2d14b"/><rect x="256" y="396" width="96" height="40" rx="4" fill="#0e1517" stroke="#3a342c"/><circle cx="270" cy="406" r="1.5" fill="#9aa4b0"/><circle cx="281" cy="413" r="2.5" fill="#ff6a2a"/><circle cx="292" cy="420" r="1.5" fill="#9aa4b0"/><circle cx="303" cy="427" r="2.5" fill="#ff6a2a"/><circle cx="314" cy="434" r="1.5" fill="#9aa4b0"/><circle cx="325" cy="411" r="2.5" fill="#ff6a2a"/><circle cx="336" cy="418" r="1.5" fill="#9aa4b0"/><rect x="366" y="396" width="96" height="40" rx="4" fill="#0e1517" stroke="#3a342c"/><circle cx="434" cy="414" r="10" fill="#f0e2c8"/><circle cx="438" cy="411" r="9" fill="#14282b"/><text x="490" y="422" fill