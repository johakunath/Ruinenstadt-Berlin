<text x="672.0" y="808.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Raptoren und Krähen kommen den Schacht hoch.</text>
<text x="672.0" y="829.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >2 Wellen, Echo des Hauptmanns. Ranken, Blick in die Tiefe.</text>
<text x="672.0" y="578.0" fill="#f3ce43" font-size="17" font-weight="700" text-anchor="start" >E2 · Panoramaetage · 203 m · 1981 + 1989</text>
<text x="672.0" y="602.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Gegner brechen durch die Fenster ihres Bezirks</text>
<text x="672.0" y="623.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >(echte Himmelsrichtung vom Turm).</text>
<text x="672.0" y="644.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Ein Zeiger kreist langsam durch den Ring.</text>
<text x="672.0" y="665.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >3 Wellen, Echo der Spreehexe.</text>
<text x="672.0" y="686.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Unten liegt die Stadt, jeder Bezirk in seinem Licht.</text>
<text x="672.0" y="403.0" fill="#cfc8ee" font-size="17" font-weight="700" text-anchor="start" >E3 · Telecafé · 207 m · 1920 + 2089</text>
<text x="672.0" y="427.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Der äußere Boden dreht sich und trägt alles mit.</text>
<text x="672.0" y="448.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Gedeckte Tische als Deckung, Fest mitten im Toast.</text>
<text x="672.0" y="469.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Tresen = Rast vor dem Boss.</text>
<text x="672.0" y="490.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >3 Wellen, Echo des Basspredigers.</text>
<text x="672.0" y="215.0" fill="#7fd8d0" font-size="17" font-weight="700" text-anchor="start" >E4 · Uhrenraum · Kugelspitze · alle Zeiten</text>
<text x="672.0" y="239.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Boss: Der Zeitwart am Werk des Zeitnormals.</text>
<text x="672.0" y="260.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Zwei Zeiger fegen durch den Ring, Zeitsprünge, Echos.</text>
<text x="672.0" y="281.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Bei 66 % und 33 %: Zahnrad am Werk einsetzen (halten).</text>
<text x="672.0" y="302.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Danach die Wahl am Hauptschalter:</text>
<text x="672.0" y="323.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >„Uhr stellen“ oder „Stehen lassen“. Sonnenaufgang.</text>
<text x="672.0" y="1090.0" fill="#8a9494" font-size="13.5" font-weight="400" text-anchor="start" >Ringarena: der Kern blockt Sicht und Geschosse.</text>
