<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- M16 step 7 mockup: schematic, example shapes only. Variant A of each row is the pick (see docs/tasks/m16-charlottenburg.md › step 7). -->
  <rect width="1200" height="980" fill="#14131a"/>
  <text x="24" y="34" fill="#f2eee6" font-size="20" font-weight="bold">Charlottenburg 1920 · Schritt 7: Fassade, Grundstückstypen, Fahrzeuge</text>
  <text x="24" y="54" fill="#a9a3b8">Je Zeile zwei klar verschiedene Varianten. Skizze, keine echten Maße.</text>

  <!-- Row 1: facades (front elevation, ground floor below 5 m is what the camera reads) -->
  <text x="24" y="92" fill="#f2c14b" font-size="15" font-weight="bold">1 · Fassade 1920 (Blockrand)</text>
  <g transform="translate(24,104)">
    <rect width="560" height="250" rx="8" fill="#1d1c25" stroke="#f2c14b" stroke-width="2"/>
    <text x="14" y="22" fill="#f2eee6" font-weight="bold">F-A Stuck-Altbau, Läden mit Markisen</text>
    <g transform="translate(30,40)">
      <rect width="500" height="190" fill="#d8ccb0"/>
      <g fill="#3a3550"><rect x="30" y="20" width="34" height="44"/><rect x="110" y="20" width="34" height="44"/><rect x="190" y="20" width="34" height="44"/><rect x="270" y="20" width="34" height="44"/><rect x="350" y="20" width="34" height="44"/><rect x="430" y="20" width="34" height="44"/></g>
      <g fill="#f4c36a"><rect x="30" y="20" width="34" height="44" opacity=".0"/><rect x="190" y="20" width="34" height="44" opacity=".8"/><rect x="430" y="20" width="34" height="44" opacity=".6"/></g>
      <rect x="0" y="74" width="500" height="8" fill="#b9ab8c"/>
      <!-- shop fronts -->
      <g><rect x="10" y="112" width="150" height="70" fill="#2b2433"/><rect x="18" y="122" width="134" height="48" fill="#f4c36a" opacity=".85"/></g>
      <g><rect x="180" y="112" width="140" height="70" fill="#2b2433"/><rect x="188" y="122" width="124" height="48" fill="#ffe3b0" opacity=".7"/></g>
      <g><rect x="340" y="112" width="150" height="70" fill="#2b2433"/><rect x="348" y="122" width="134" height="48" fill="#f4c36a" opacity=".6"/></g>
      <!-- awnings striped -->
      <g><path d="M4 96 h162 l-10 18 h-142z" fill="#b5332e"/><path d="M24 96 h14 l-3 18 h-14z M56 96 h14 l-3 18 h-14z M88 96 h14 l-3 18 h-14z M120 96 h14 l-3 18 h-14z" fill="#f2eee6"/></g>
      <g><path d="M174 96 h152 l-10 18 h-132z" fill="#2f6f5a"/><path d="M192 96 h14 l-3 18 h-14z M224 96 h14 l-3 18 h-14z M256 96 h14 l-3 18 h-14z M288 96 h14 l-3 18 h-14z" fill="#f2eee6"/></g>
      <g><path d="M334 96 h162 l-10 18 h-142z" fill="#c8892c"/><path d="M354 96 h14 l-3 18 h-14z M386 96 h14 l-3 18 h-14z M418 96 h14 l-3 18 h-14z M450 96 h14 l-3 18 h-14z" fill="#f2eee6"/></g>
      <g fill="#f2eee6" font-size="11"><text x="40" y="92">KOLONIALWAREN</text><text x="214" y="92">CAFÉ</text><text x="372" y="92">HÜTE · MODEN</text></g>
    </g>
    <text x="14" y="244" fill="#a9a3b8" font-size="12">Farbige Markisen und helle Schaufenster lesen von oben; Stuck grau-beige, ruiniert wie Köpenick.</text>
  </g>
  <g transform="translate(616,104)">
    <rect width="560" height="250" rx="8" fill="#1d1c25" stroke="#58546a" stroke-width="1.5"/>
    <text x="14" y="22" fill="#f2eee6" font-weight="bold">F-B Jugendstil, Erker und dunkles Ladenband</text>
    <g transform="translate(30,40)">
      <rect width="500" height="190" fill="#bfb6a8"/>
      <g fill="#a49a88"><rect x="70" y="8" width="90" height="96"/><rect x="330" y="8" width="90" height="96"/></g>
      <g fill="#3a3550"><rect x="84" y="20" width="26" height="34"/><rect x="120" y="20" width="26" height="34"/><rect x="84" y="64" width="26" height="34"/><rect x="120" y="64" width="26" height="34"/>
        <rect x="344" y="20" width="26" height="34"/><rect x="380" y="20" width="26" height="34"/><rect x="344" y="64" width="26" height="34"/><rect x="380" y="64" width="26" height="34"/>
        <rect x="210" y="24" width="30" height="40"/><rect x="260" y="24" width="30" height="40"/><rect x="20" y="24" width="30" height="40"/><rect x="450" y="24" width="30" height="40"/></g>
      <rect x="0" y="112" width="500" height="78" fill="#1a1820"/>
      <g fill="#d4a94a" font-size="12" font-weight="bold"><text x="24" y="132">CONDITOREI</text><text x="190" y="132">PELZE</text><text x="340" y="132">BUCHHANDLUNG</text></g>
      <g fill="#ffe3b0" opacity=".55"><rect x="20" y="140" width="130" height="40"/><rect x="186" y="140" width="120" height="40"/><rect x="336" y="140" width="140" height="40"/></g>
      <g fill="#7d7464"><rect x="60" y="104" width="110" height="6"/><rect x="320" y="104" width="110" height="6"/></g>
    </g>
    <text x="14" y="244" fill="#a9a3b8" font-size="12">Schön im Aufriss, aber Erker und Goldschrift sind von oben kaum zu lesen.</text>
  </g>

  <!-- Row 2: lot types per zone (top view) -->
  <text x="24" y="392" fill="#f2c14b" font-size="15" font-weight="bold">2 · Zwei Grundstückstypen je Zone (Draufsicht, Straße unten)</text>
  <g transform="translate(24,404)">
    <rect width="560" height="330" rx="8" fill="#1d1c25" stroke="#f2c14b" stroke-width="2"/>
    <text x="14" y="22" fill="#f2eee6" font-weight="bold">Variante A (Konzept C2)</text>
    <!-- zone 1 -->
    <text x="14" y="46" fill="#9fb4ff">Zone 1 Blaue Stunde</text>
    <g transform="translate(14,54)"><rect width="126" height="80" fill="#3a3a44"/><rect x="0" y="80" width="126" height="10" fill="#555"/>
      <g fill="#f2c14b"><rect x="12" y="14" width="20" height="10"/><rect x="12" y="34" width="20" height="10"/><rect x="12" y="54" width="20" height="10"/></g>
      <g fill="#222"><rect x="50" y="14" width="22" height="10"/><rect x="50" y="34" width="22" height="10"/></g>
      <rect x="92" y="10" width="22" height="30" fill="#6c5a3a"/><circle cx="103" cy="58" r="5" fill="#ffc870"/>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Droschkenplatz: Taxen,</text><text x="4" y="117" fill="#a9a3b8" font-size="11">Kutscherbude, Laterne</text></g>
    <g transform="translate(150,54)"><rect width="126" height="80" fill="#2f2c35"/><rect x="0" y="80" width="126" height="10" fill="#555"/>
      <rect x="50" y="0" width="26" height="80" fill="#6b6460"/><g fill="#ffe3b0" opacity=".8"><rect x="10" y="8" width="34" height="14"/><rect x="10" y="30" width="34" height="14"/><rect x="10" y="52" width="34" height="14"/><rect x="82" y="8" width="34" height="14"/><rect x="82" y="30" width="34" height="14"/><rect x="82" y="52" width="34" height="14"/></g>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Schaufensterpassage:</text><text x="4" y="117" fill="#a9a3b8" font-size="11">Glasdach-Ruine, Puppen</text></g>
    <!-- zone 2 -->
    <text x="296" y="46" fill="#ff6fb5">Zone 2 Premierennacht</text>
    <g transform="translate(296,54)"><rect width="126" height="80" fill="#262128"/><rect x="0" y="80" width="126" height="10" fill="#555"/>
      <rect x="10" y="4" width="106" height="20" fill="#7a2a3a"/><g fill="#fff2ea"><circle cx="16" cy="28" r="2"/><circle cx="28" cy="28" r="2"/><circle cx="40" cy="28" r="2"/><circle cx="52" cy="28" r="2"/><circle cx="64" cy="28" r="2"/><circle cx="76" cy="28" r="2"/><circle cx="88" cy="28" r="2"/><circle cx="100" cy="28" r="2"/></g>
      <rect x="54" y="44" width="18" height="16" fill="#c8892c"/><g fill="#d8ccb0"><circle cx="18" cy="60" r="6"/><circle cx="108" cy="60" r="6"/></g>
      <path d="M30 70 q16 -8 32 0 q16 8 32 0" stroke="#b5332e" stroke-width="3" fill="none"/>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Kinovorplatz: Kasse,</text><text x="4" y="117" fill="#a9a3b8" font-size="11">Litfaßsäulen, Samtkordel</text></g>
    <g transform="translate(432,54)"><rect width="114" height="80" fill="#2a262b"/><rect x="0" y="80" width="114" height="10" fill="#555"/>
      <rect x="0" y="0" width="114" height="22" fill="#4a4048"/><rect x="40" y="30" width="34" height="20" fill="#111"/><path d="M44 50 h26 l-4 10 h-18z" fill="#333"/>
      <rect x="84" y="30" width="20" height="10" fill="#ff58c8" opacity=".8"/><circle cx="20" cy="60" r="6" fill="#ff8a3a"/>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Jazzkeller-Hof:</text><text x="4" y="117" fill="#a9a3b8" font-size="11">Kellertreppe, Neon rosa</text></g>
    <!-- zone 3 -->
    <text x="14" y="200" fill="#9fd0ff">Zone 3 Mondnacht (von Hand gesetzt)</text>
    <g transform="translate(14,208)"><rect width="126" height="80" fill="#1f2a22"/>
      <rect x="6" y="6" width="114" height="68" fill="none" stroke="#2f5a34" stroke-width="7"/><circle cx="63" cy="40" r="7" fill="#c9c4b8"/><rect x="96" y="30" width="12" height="20" fill="#9fd0ff" opacity=".7"/>
      <text x="4" y="98" fill="#f2eee6" font-size="11">Heckenkabinett: Statue,</text><text x="4" y="111" fill="#a9a3b8" font-size="11">Spiegel, Kerzen</text></g>
    <g transform="translate(150,208)"><rect width="126" height="80" fill="#1f2a22"/>
      <path d="M16 70 a47 47 0 0 1 94 0z" fill="#5a5040"/><rect x="30" y="10" width="66" height="22" fill="#3a3430"/><g fill="#c9c4b8"><rect x="34" y="12" width="6" height="18"/><rect x="86" y="12" width="6" height="18"/></g>
      <text x="4" y="98" fill="#f2eee6" font-size="11">Gartentheater: Bühnen-</text><text x="4" y="111" fill="#a9a3b8" font-size="11">ruine, Rasenstufen</text></g>
    <text x="296" y="230" fill="#a9a3b8" font-size="12">Zone 4 Spiegelschloss: keine (Sehenswürdigkeiten).</text>
    <text x="296" y="254" fill="#a9a3b8" font-size="12">Jeder Typ trägt die Tageszeit seiner Zone:</text>
    <text x="296" y="270" fill="#a9a3b8" font-size="12">Laternen am Droschkenplatz, Glühbirnen</text>
    <text x="296" y="286" fill="#a9a3b8" font-size="12">am Kino, Kerzen im Heckenkabinett.</text>
  </g>
  <g transform="translate(616,404)">
    <rect width="560" height="330" rx="8" fill="#1d1c25" stroke="#58546a" stroke-width="1.5"/>
    <text x="14" y="22" fill="#f2eee6" font-weight="bold">Variante B (Alltag statt Revue)</text>
    <text x="14" y="46" fill="#9fb4ff">Zone 1</text>
    <g transform="translate(14,54)"><rect width="126" height="80" fill="#24302a"/><rect x="0" y="80" width="126" height="10" fill="#555"/>
      <g fill="#6c5a3a"><rect x="14" y="14" width="40" height="8"/><rect x="14" y="40" width="40" height="8"/><rect x="70" y="14" width="40" height="8"/><rect x="70" y="40" width="40" height="8"/></g><circle cx="63" cy="66" r="8" fill="#2f5a34"/>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Zoo-Biergarten</text></g>
    <g transform="translate(150,54)"><rect width="126" height="80" fill="#2f2c35"/><rect x="0" y="80" width="126" height="10" fill="#555"/>
      <g fill="#8a6a4a"><rect x="10" y="10" width="30" height="20"/><rect x="48" y="10" width="30" height="20"/><rect x="86" y="10" width="30" height="20"/><rect x="10" y="44" width="30" height="20"/><rect x="86" y="44" width="30" height="20"/></g>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Markthallen-Stände</text></g>
    <text x="296" y="46" fill="#ff6fb5">Zone 2</text>
    <g transform="translate(296,54)"><rect width="126" height="80" fill="#262128"/><rect x="0" y="80" width="126" height="10" fill="#555"/>
      <rect x="10" y="10" width="106" height="50" fill="#5a4a3a"/><g fill="#d8ccb0"><circle cx="30" cy="30" r="5"/><circle cx="60" cy="30" r="5"/><circle cx="90" cy="30" r="5"/></g>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Tanzpalast-Terrasse</text></g>
    <g transform="translate(432,54)"><rect width="114" height="80" fill="#2a262b"/><rect x="0" y="80" width="114" height="10" fill="#555"/>
      <path d="M8 60 v-34 a20 20 0 0 1 40 0 v34z M62 60 v-34 a20 20 0 0 1 40 0 v34z" fill="#8a4a3a"/><rect x="18" y="44" width="20" height="10" fill="#777"/>
      <text x="4" y="104" fill="#f2eee6" font-size="11">Bogen-Werkstätten</text></g>
    <text x="14" y="200" fill="#9fd0ff">Zone 3</text>
    <g transform="translate(14,208)"><rect width="126" height="80" fill="#1f2a22"/><g fill="#9fd0ff" opacity=".35"><rect x="10" y="10" width="50" height="30"/><rect x="66" y="10" width="50" height="30"/></g><g fill="#3e6a3a"><rect x="10" y="50" width="106" height="8"/><rect x="10" y="62" width="106" height="8"/></g>
      <text x="4" y="98" fill="#f2eee6" font-size="11">Schlossgärtnerei</text></g>
    <g transform="translate(150,208)"><rect width="126" height="80" fill="#1d2a36"/><rect x="40" y="0" width="12" height="60" fill="#6c5a3a"/><path d="M60 30 q20 -10 40 0 q-20 14 -40 0" fill="#7a5a3a"/>
      <text x="4" y="98" fill="#f2eee6" font-size="11">Bootsanleger Spree</text></g>
    <text x="296" y="230" fill="#a9a3b8" font-size="12">Ruhiger, mehr Stadtleben, weniger Revue.</text>
    <text x="296" y="254" fill="#a9a3b8" font-size="12">Bogen-Werkstätten doppeln den Späti im</text>
    <text x="296" y="270" fill="#a9a3b8" font-size="12">Stadtbahnbogen; der Anleger liegt am</text>
    <text x="296" y="286" fill="#a9a3b8" font-size="12">Rand hinter dem Zaun (C2: Ufer ist Kulisse).</text>
  </g>

  <!-- Row 3: vehicles -->
  <text x="24" y="772" fill="#f2c14b" font-size="15" font-weight="bold">3 · Fahrzeuge 1920 (Seitenansicht, Wracks)</text>
  <g transform="translate(24,784)">
    <rect width="560" height="180" rx="8" fill="#1d1c25" stroke="#f2c14b" stroke-width="2"/>
    <text x="14" y="22" fill="#f2eee6" font-weight="bold">V-A Motorwagen</text>
    <g transform="translate(16,50)"><rect x="10" y="20" width="96" height="26" fill="#1e2a22"/><rect x="40" y="0" width="54" height="22" fill="#1e2a22"/><rect x="46" y="4" width="18" height="12" fill="#6a7a80"/><rect x="70" y="4" width="18" height="12" fill="#6a7a80"/>
      <rect x="10" y="36" width="96" height="5" fill="#f2c14b"/><circle cx="28" cy="50" r="10" fill="#222" stroke="#999"/><circle cx="90" cy="50" r="10" fill="#222" stroke="#999"/><text x="10" y="80" fill="#a9a3b8" font-size="11">Kraftdroschke</text></g>
    <g transform="translate(140,50)"><rect x="6" y="20" width="100" height="24" fill="#5a2a2a"/><rect x="44" y="2" width="50" height="20" fill="#5a2a2a"/><rect x="50" y="6" width="38" height="12" fill="#6a7a80"/><circle cx="26" cy="48" r="10" fill="#222" stroke="#999"/><circle cx="88" cy="48" r="10" fill="#222" stroke="#999"/><text x="6" y="80" fill="#a9a3b8" font-size="11">Limousine</text></g>
    <g transform="translate(264,36)"><rect x="0" y="8" width="128" height="30" fill="#c8b070"/><rect x="0" y="40" width="128" height="30" fill="#c8b070"/><g fill="#3a3550"><rect x="8" y="46" width="16" height="14"/><rect x="30" y="46" width="16" height="14"/><rect x="52" y="46" width="16" height="14"/><rect x="74" y="46" width="16" height="14"/><rect x="96" y="46" width="16" height="14"/></g><rect x="0" y="2" width="128" height="6" fill="#6a5a3a"/>
      <circle cx="20" cy="74" r="10" fill="#222" stroke="#999"/><circle cx="108" cy="74" r="10" fill="#222" stroke="#999"/><text x="0" y="102" fill="#a9a3b8" font-size="11">Doppeldecker (offen oben)</text></g>
    <g transform="translate(410,46)"><rect x="0" y="10" width="130" height="50" fill="#e6d9a8"/><rect x="0" y="40" width="130" height="10" fill="#c8892c"/><g fill="#3a3550"><rect x="10" y="18" width="20" height="18"/><rect x="38" y="18" width="20" height="18"/><rect x="66" y="18" width="20" height="18"/><rect x="94" y="18" width="20" height="18"/></g><path d="M60 10 l10 -12 h4" stroke="#999" stroke-width="2" fill="none"/>
      <circle cx="26" cy="64" r="7" fill="#222"/><circle cx="104" cy="64" r="7" fill="#222"/><text x="0" y="92" fill="#a9a3b8" font-size="11">Straßenbahn, zweiachsig</text></g>
    <text x="14" y="168" fill="#a9a3b8" font-size="12">Baut auf den heutigen Auto-, Bus- und Bahn-Props auf (gleiche Plätze, Kollider, Wracklogik).</text>
  </g>
  <g transform="translate(616,784)">
    <rect width="560" height="180" rx="8" fill="#1d1c25" stroke="#58546a" stroke-width="1.5"/>
    <text x="14" y="22" fill="#f2eee6" font-weight="bold">V-B Pferdewagen mit wenigen Autos</text>
    <g transform="translate(20,50)"><rect x="60" y="10" width="70" height="34" fill="#2a2a2a"/><path d="M60 10 q35 -16 70 0" fill="#2a2a2a"/><circle cx="74" cy="50" r="13" fill="none" stroke="#999" stroke-width="2"/><circle cx="118" cy="50" r="13" fill="none" stroke="#999" stroke-width="2"/>
      <path d="M0 28 q10 -14 26 -8 l20 6 v18 h-6 v-10 h-26 v12 h-6z" fill="#6a4a30"/><text x="0" y="86" fill="#a9a3b8" font-size="11">Pferdedroschke (Pferd tot daneben)</text></g>
    <g transform="translate(250,50)"><rect x="40" y="14" width="110" height="28" fill="#7a5a3a"/><g fill="#5a3a2a"><circle cx="64" cy="18" r="10"/><circle cx="90" cy="18" r="10"/><circle cx="116" cy="18" r="10"/></g><circle cx="60" cy="50" r="12" fill="none" stroke="#999" stroke-width="2"/><circle cx="132" cy="50" r="12" fill="none" stroke="#999" stroke-width="2"/>
      <text x="40" y="86" fill="#a9a3b8" font-size="11">Bierwagen mit Fässern</text></g>
    <text x="14" y="156" fill="#a9a3b8" font-size="12">Älter im Bild (1910er). Braucht Pferde als Modelle (P18 Tiere ist noch nicht gebaut);</text>
    <text x="14" y="172" fill="#a9a3b8" font-size="12">Wagen ohne Pferd lesen von oben als Kisten.</text>
  </g>
</svg>
