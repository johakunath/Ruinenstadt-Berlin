<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" font-family="Inter, Arial, sans-serif">
<rect width="1440" height="640" fill="#0e1517"/>
<defs>
  <g id="leg">
    <!-- reused nothing; legend drawn once below -->
  </g>
  <style>
    .spree{fill:none;stroke:#2c5a6a;stroke-linecap:round;stroke-linejoin:round}
    .kanal{fill:none;stroke:#2c5a6a;stroke-linecap:round;stroke-linejoin:round}
    .wall{fill:none;stroke:#d8d0c0;stroke-width:2.2;stroke-dasharray:6 2}
    .u1{fill:none;stroke:#3f8a5a;stroke-width:3.2;stroke-dasharray:7 3}
    .st{fill:none;stroke:#5a5248;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .route{fill:none;stroke:#ef9f27;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .enc{fill:#ef9f2733;stroke:#ef9f27;stroke-width:1.4}
    .boss{fill:#c8322833;stroke:#e04a3a;stroke-width:2}
    .fin{fill:#c8322855;stroke:#ff5a48;stroke-width:2.6}
    .lm{fill:#f0d9b0;stroke:#0e1517;stroke-width:1}
    .sp{fill:#f2d14b;stroke:#0e1517;stroke-width:1}
    .zl{font-size:10px;font-weight:700}
    .t{font-size:7.5px;fill:#cfc4b2}
    .tw{font-size:7.5px;fill:#9fd0dc;font-style:italic}
  </style>
</defs>
<text x="20" y="30" fill="#f0d9b0" font-size="20" font-weight="700">M15 Xhain · drei Layouts (Ursprung Oberbaumbrücke, Richtungen nach OpenStreetMap, 1981: die Mauer steht)</text>
<text x="20" y="52" fill="#b5aa98" font-size="13">Norden oben. Orange: Route, Kreise: Kämpfe (rot: Boss, groß: Spreehexe). Gelb: Späti. Grün gestrichelt: Hochbahn U1. Weiß gestrichelt: Mauer am Friedrichshainer Ufer</text>

<!-- ============ A ============ -->
<g transform="translate(20,80)">
<text x="0" y="0" fill="#ef9f27" font-size="17" font-weight="700">A · Kreuzberg-Rundweg</text>
<text x="0" y="20" fill="#b5aa98" font-size="12">Zwischen Spree und Kanal, Hochbahn als Achse, eine Schleife</text>
<svg x="0" y="32" width="450" height="345" viewBox="-280 -135 340 260">
<rect x="-280" y="-135" width="340" height="260" fill="#2a2522"/>
<!-- Friedrichshain (East) beyond the Spree -->
<polygon points="-280,-135 60,-135 60,-10 30,22 0,-4 -40,-36 -100,-82 -180,-116 -280,-128" fill="#1c1d22"/>
<polyline class="spree" stroke-width="22" points="-280,-120 -180,-106 -100,-72 -40,-26 0,4 34,32 60,60"/>
<polyline class="wall" points="-280,-134 -178,-120 -96,-86 -34,-40 4,-12 40,14 60,30"/>
<text class="tw" x="-150" y="-122">Mauer · Ost-Berlin</text>
<text class="tw" x="-70" y="-58" transform="rotate(38 -70 -58)">Spree</text>
<!-- Landwehrkanal -->
<polyline class="kanal" stroke-width="12" points="-280,104 -220,100 -160,114 -90,132 -40,122 10,96 40,72 58,58"/>
<text class="tw" x="-200" y="122">Landwehrkanal</text>
<!-- streets -->
<polyline class="st" points="-262,44 -150,38 -40,14 0,2"/>
<polyline class="st" points="-262,8 -200,6 -130,-4 -90,-30"/>
<polyline class="st" points="-238,44 -232,0 -205,-40"/>
<polyline class="st" points="-205,-40 -150,-74 -100,-62 -60,-30"/>
<polyline class="st" points="-100,-62 -112,-10 -122,28 -110,70 -70,104"/>
<polyline class="st" points="-70,104 -20,92 -10,50 -40,14"/>
<polyline class="u1" points="-262,44 -150,38 -40,14 0,2 40,-20"/>
<!-- Görli freight yard -->
<polygon points="-130,52 -40,48 -24,92 -110,98" fill="#3a3a2c" stroke="#5b5a44" stroke-width="1"/>
<text class="t" x="-104" y="80">Görlitzer Bahnhof (Ruine)</text>
<!-- route -->
<polyline class="route" points="-250,46 -236,30 -232,0 -205,-40 -178,-62 -150,-74 -100,-62 -112,-10 -122,28 -110,70 -70,104 -20,92 -10,50 -40,14 -14,4"/>
<!-- zone labels -->
<text class="zl" x="-276" y="70" fill="#e8b860">1 SO36 · Kotti</text>
<text class="zl" x="-270" y="-60" fill="#e8b860">2 Mariannenplatz</text>
<text class="zl" x="-90" y="118" fill="#e8b860">3 Görli · Wrangelkiez</text>
<!-- encounters zone 1 -->
<circle class="enc" cx="-240" cy="30" r="13"/><circle class="enc" cx="-210" cy="6" r="13"/><circle class="enc" cx="-232" cy="-18" r="13"/><circle class="boss" cx="-206" cy="-40" r="14"/>
<!-- zone 2 -->
<circle class="enc" cx="-178" cy="-60" r="13"/><circle class="enc" cx="-150" cy="-74" r="13"/><circle class="enc" cx="-122" cy="-66" r="13"/><circle class="boss" cx="-98" cy="-58" r="14"/>
<!-- zone 3 -->
<circle class="enc" cx="-120" cy="24" r="13"/><circle class="enc" cx="-100" cy="74" r="14"/><circle class="enc" cx="-60" cy="102" r="13"/><circle class="boss" cx="-14" cy="80" r="15"/>
<circle class="fin" cx="-18" cy="6" r="16"/>
<!-- landmarks -->
<rect class="lm" x="-262" y="38" width="20" height="12"/><text class="t" x="-276" y="60">NKZ Kotti</text>
<rect class="lm" x="-222" y="-50" width="8" height="12"/><text class="t" x="-262" y="-40">Bethanien</text>
<rect class="lm" x="-192" y="-84" width="9" height="7"/><text class="t" x="-200" y="-88">Rauch-Haus</text>
<rect class="lm" x="-128" y="14" width="6" height="8"/><text class="t" x="-160" y="12">Emmaus</text>
<rect class="lm" x="-6" y="-6" width="14" height="10" transform="rotate(38 0 0)"/><text class="t" x="8" y="-8">Oberbaumbrücke</text>
<rect class="lm" x="-48" y="8" width="10" height="8"/><text class="t" x="-56" y="30">Schles. Tor</text>
<!-- spätis -->
<rect class="sp" x="-226" y="16" width="7" height="5"/><rect class="sp" x="-132" y="-80" width="7" height="5"/><rect class="sp" x="-130" y="40" width="7" height="5"/><rect class="sp" x="-30" y="34" width="7" height="5"/>
<text class="t" x="-276" y="-124" fill="#8a8070">340 × 260 m</text>
</svg>
<text x="0" y="400" fill="#f0d9b0" font-size="12.5" font-weight="700">+ Größe wie Köpenick v2, Wasser als Rand auf zwei Seiten</text>
<text x="0" y="418" fill="#cfc4b2" font-size="12">Start U Kottbusser Tor, Oranienstraße, Hausbesetzer am Mariannenplatz,</text>
<text x="0" y="434" fill="#cfc4b2" font-size="12">am Spreeufer mit Blick auf die Mauer, Görlitzer Bahnhof als Ruine,</text>
<text x="0" y="450" fill="#cfc4b2" font-size="12">Kanal, Schlesisches Tor, Spreehexe auf der Oberbaumbrücke.</text>
<text x="0" y="470" fill="#cfc4b2" font-size="12">Route ≈ 820 m · keine Straße doppelt · Hochbahn zweimal gekreuzt</text>
<text x="0" y="488" fill="#b58a5a" font-size="12">− Ost-Ufer nur als Kulisse hinter der Spree</text>
</g>

<!-- ============ B ============ -->
<g transform="translate(495,80)">
<text x="0" y="0" fill="#ef9f27" font-size="17" font-weight="700">B · Über die Mauer</text>
<text x="0" y="20" fill="#b5aa98" font-size="12">Beide Spreeufer: Start im Osten, Durchbruch über die Schillingbrücke</text>
<svg x="0" y="32" width="450" height="345" viewBox="-280 -200 340 260">
<rect x="-280" y="-200" width="340" height="260" fill="#2a2522"/>
<!-- East bank darker ground -->
<polygon points="-280,-200 60,-200 60,-10 30,22 0,-4 -40,-36 -100,-82 -180,-116 -280,-128" fill="#25252a"/>
<polyline class="spree" stroke-width="24" points="-280,-120 -180,-106 -100,-72 -40,-26 0,4 34,32 60,60"/>
<polyline class="wall" points="-280,-134 -178,-120 -96,-86 -34,-40 4,-12 40,14 60,30"/>
<text class="tw" x="-60" y="-80" transform="rotate(38 -60 -80)">Mauer (East Side)</text>
<!-- Stadtbahn viaduct -->
<polyline fill="none" stroke="#7a3a26" stroke-width="4" points="-280,-165 -110,-160 30,-140 60,-136"/>
<text class="t" x="-250" y="-170">Stadtbahn</text>
<!-- streets -->
<polyline class="st" points="30,-70 -30,-60 -90,-100 -160,-128"/>
<polyline class="st" points="30,-70 30,-140"/>
<polyline class="st" points="-160,-128 -176,-96 -190,-64"/>
<polyline class="st" points="-190,-64 -206,-36 -236,0 -240,40"/>
<polyline class="st" points="-240,40 -150,38 -40,14 0,2"/>
<polyline class="st" points="-150,38 -110,60 -60,40"/>
<polyline class="u1" points="-262,44 -150,38 -40,14 0,2 30,-60"/>
<!-- Schillingbrücke -->
<rect x="-176" y="-128" width="12" height="30" fill="#6a6054" transform="rotate(-20 -170 -113)"/>
<text class="t" x="-160" y="-108">Schillingbrücke</text>
<!-- route -->
<polyline class="route" points="28,-80 -30,-62 -90,-100 -160,-128 -176,-96 -190,-64 -206,-36 -236,0 -240,40 -150,38 -110,60 -60,40 -40,14 -14,4"/>
<!-- zones -->
<text class="zl" x="-90" y="-180" fill="#e8b860">1 Mühlenstraße (Ost)</text>
<text class="zl" x="-276" y="-60" fill="#e8b860">2 Mariannenplatz</text>
<text class="zl" x="-200" y="78" fill="#e8b860">3 Kotti · Hochbahn · Görli</text>
<circle class="enc" cx="18" cy="-90" r="13"/><circle class="enc" cx="-32" cy="-66" r="13"/><circle class="enc" cx="-90" cy="-112" r="14"/><circle class="boss" cx="-148" cy="-140" r="14"/>
<circle class="enc" cx="-180" cy="-86" r="13"/><circle class="enc" cx="-198" cy="-52" r="13"/><circle class="enc" cx="-226" cy="-12" r="13"/><circle class="boss" cx="-238" cy="30" r="14"/>
<circle class="enc" cx="-180" cy="38" r="13"/><circle class="enc" cx="-120" cy="56" r="14"/><circle class="enc" cx="-70" cy="40" r="13"/><circle class="fin" cx="-18" cy="6" r="16"/>
<!-- landmarks -->
<rect class="lm" x="20" y="-74" width="16" height="10"/><text class="t" x="-6" y="-48">S Warschauer Str.</text>
<rect class="lm" x="-112" y="-178" width="22" height="10"/><text class="t" x="-128" y="-184">Ostbahnhof</text>
<rect class="lm" x="-156" y="-150" width="5" height="9"/><text class="t" x="-200" y="-152">Wachturm</text>
<rect class="lm" x="-222" y="-50" width="8" height="12"/><text class="t" x="-266" y="-44">Bethanien</text>
<rect class="lm" x="-262" y="38" width="20" height="12"/><text class="t" x="-276" y="60">NKZ Kotti</text>
<rect class="lm" x="-6" y="-6" width="14" height="10" transform="rotate(38 0 0)"/><text class="t" x="8" y="10">Oberbaum</text>
<rect class="sp" x="-60" y="-80" width="7" height="5"/><rect class="sp" x="-200" y="-100" width="7" height="5"/><rect class="sp" x="-150" y="44" width="7" height="5"/><rect class="sp" x="-40" y="26" width="7" height="5"/>
<text class="t" x="-276" y="52" fill="#8a8070">340 × 260 m</text>
</svg>
<text x="0" y="400" fill="#f0d9b0" font-size="12.5" font-weight="700">+ Mauer und Todesstreifen spielbar, zwei Spree-Brücken</text>
<text x="0" y="418" fill="#cfc4b2" font-size="12">Start S Warschauer Straße, Mühlenstraße hinter der Mauer, Ostbahnhof,</text>
<text x="0" y="434" fill="#cfc4b2" font-size="12">Wachturm an der Schillingbrücke, Mariannenplatz, Kotti, unter der</text>
<text x="0" y="450" fill="#cfc4b2" font-size="12">Hochbahn zurück nach Osten, Spreehexe auf der Oberbaumbrücke.</text>
<text x="0" y="470" fill="#cfc4b2" font-size="12">Route ≈ 900 m · keine Straße doppelt</text>
<text x="0" y="488" fill="#b58a5a" font-size="12">− Görli und Kanal nur am Rand, Zone 1 ist Ost-Berlin statt Hausbesetzer</text>
</g>

<!-- ============ C ============ -->
<g transform="translate(970,80)">
<text x="0" y="0" fill="#ef9f27" font-size="17" font-weight="700">C · Linie U1</text>
<text x="0" y="20" fill="#b5aa98" font-size="12">Lang und schmal unter der Hochbahn, Nebenwege nach Nord und Süd</text>
<svg x="0" y="32" width="450" height="345" viewBox="-420 -150 480 368">
<rect x="-420" y="-150" width="480" height="368" fill="#0e1517"/>
<rect x="-420" y="-60" width="480" height="150" fill="#2a2522"/>
<polyline class="spree" stroke-width="20" points="-30,-60 0,4 30,40"/>
<polyline class="wall" points="-14,-62 12,-10 42,26"/>
<polyline class="kanal" stroke-width="10" points="-420,92 -200,92 -60,94 40,70"/>
<!-- streets -->
<polyline class="st" points="-410,40 -270,42 -170,38 -45,14 0,2 34,-46"/>
<polyline class="st" points="-330,40 -320,-30"/>
<polyline class="st" points="-220,40 -200,-40"/>
<polyline class="st" points="-120,30 -110,80"/>
<polyline class="st" points="-60,20 -70,-40"/>
<polyline class="u1" points="-410,40 -270,42 -170,38 -45,14 0,2 34,-46"/>
<polyline class="route" points="-405,40 -330,40 -320,-30 -330,40 -270,42 -220,40 -200,-40 -220,40 -170,38 -120,30 -110,80 -120,30 -60,20 -45,14 -14,4"/>
<text class="zl" x="-415" y="-40" fill="#e8b860">1 Prinzenstraße</text>
<text class="zl" x="-260" y="-48" fill="#e8b860">2 Kotti</text>
<text class="zl" x="-150" y="-30" fill="#e8b860">3 Görli</text>
<circle class="enc" cx="-380" cy="40" r="13"/><circle class="enc" cx="-322" cy="-22" r="13"/><circle class="enc" cx="-300" cy="42" r="13"/><circle class="boss" cx="-262" cy="42" r="14"/>
<circle class="enc" cx="-230" cy="40" r="13"/><circle class="enc" cx="-202" cy="-34" r="13"/><circle class="enc" cx="-185" cy="38" r="13"/><circle class="boss" cx="-150" cy="34" r="14"/>
<circle class="enc" cx="-112" cy="74" r="14"/><circle class="enc" cx="-90" cy="26" r="13"/><circle class="enc" cx="-66" cy="-34" r="13"/><circle class="boss" cx="-50" cy="16" r="14"/>
<circle class="fin" cx="-12" cy="4" r="16"/>
<rect class="lm" x="-280" y="34" width="20" height="12"/><text class="t" x="-292" y="62">NKZ Kotti</text>
<rect class="lm" x="-6" y="-6" width="14" height="10" transform="rotate(38 0 0)"/><text class="t" x="6" y="18">Oberbaum</text>
<rect class="sp" x="-350" y="48" width="7" height="5"/><rect class="sp" x="-240" y="48" width="7" height="5"/><rect class="sp" x="-140" y="44" width="7" height="5"/><rect class="sp" x="-30" y="22" width="7" height="5"/>
<text class="t" x="-416" y="84" fill="#8a8070">480 × 150 m</text>
</svg>
<text x="0" y="400" fill="#f0d9b0" font-size="12.5" font-weight="700">+ Immer unter der Hochbahn, klare Richtung, billig zu rendern</text>
<text x="0" y="418" fill="#cfc4b2" font-size="12">Start U Prinzenstraße, Station für Station nach Osten, jede Zone</text>
<text x="0" y="434" fill="#cfc4b2" font-size="12">mit einem Abstecher nach Nord oder Süd, Spreehexe auf der Brücke.</text>
<text x="0" y="470" fill="#cfc4b2" font-size="12">Route ≈ 760 m</text>
<text x="0" y="488" fill="#b58a5a" font-size="12">− Abstecher laufen dieselbe Straße zurück (Regel: Schleife bevorzugt)</text>
</g>

<text x="20" y="610" fill="#b5aa98" font-size="12.5">Alle drei: 27 Wellen (9 je Zone), Boss je Zone, Spreehexe zuletzt; ein Späti je Zone; 2–3 Nebenwege (M16b) kommen in die Blöcke. Empfehlung: A.</text>
</svg>
