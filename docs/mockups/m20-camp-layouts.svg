<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 940" font-family="Inter, Arial, sans-serif">
  <rect width="1260" height="900" fill="#0e1517"/>
  <text x="24" y="34" fill="#f0d9b0" font-size="20" font-weight="700">M20 Begehbares Lager · S+U Warschauer Straße · drei Layouts (Draufsicht, Beispielwerte)</text>
  <text x="24" y="56" fill="#b5aa98" font-size="13">Orange Ring: Station betreten öffnet ihr Fenster · Blau: Abfahrt (Netzplan) · Rot: Lagerfeuer · Gelb: Bahnsteigkante · Raster 5 m</text>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1d2a2c" stroke-width="1"/></pattern>
    <pattern id="sl" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1d1a17"/><rect x="0" y="3" width="8" height="2" fill="#2e2219"/></pattern>
    <g id="ring"><circle r="11" fill="#ef9f27" fill-opacity=".12" stroke="#ef9f27" stroke-width="2"/></g>
  </defs>

  <!-- ===================== A ===================== -->
  <g transform="translate(24,80)">
    <text fill="#ef9f27" font-size="16" font-weight="700">A · Bahnsteighalle mit Nebenräumen (2D-Port)</text>
    <text y="18" fill="#b5aa98" font-size="12">2D `buildBase` 1:1, Maßstab 1/40 → 50 × 38 m.</text><text y="34" fill="#b5aa98" font-size="12">Halle am Gleis, Räume im Süden mit Türen.</text>
    <g transform="translate(0,44)">
      <rect width="400" height="300" fill="url(#grid)"/>
      <!-- tracks y 0-60 -->
      <rect x="0" y="0" width="400" height="60" fill="url(#sl)"/>
      <rect x="80" y="34" width="160" height="22" rx="3" fill="#ed9e25" stroke="#1a120c"/><text x="160" y="49" fill="#1a120c" font-size="10" text-anchor="middle" font-weight="700">U-Bahn-Zug</text>
      <rect x="0" y="60" width="400" height="3" fill="#ed9e25"/>
      <!-- hall -->
      <rect x="0" y="63" width="400" height="110" fill="#3e3d38"/>
      <g fill="#3f6a4a"><rect x="76" y="80" width="6" height="6"/><rect x="156" y="80" width="6" height="6"/><rect x="236" y="80" width="6" height="6"/><rect x="316" y="80" width="6" height="6"/></g>
      <!-- rooms -->
      <rect x="0" y="176" width="102" height="76" fill="#a9a496"/><text x="51" y="214" fill="#1a120c" font-size="11" text-anchor="middle" font-weight="700">Lazarett</text><text x="51" y="228" fill="#1a120c" font-size="9" text-anchor="middle">alte Toiletten</text>
      <rect x="104" y="176" width="78" height="64" fill="#6a3a2a"/><text x="143" y="210" fill="#f0d9b0" font-size="11" text-anchor="middle" font-weight="700">Imbiss</text><text x="143" y="223" fill="#f0d9b0" font-size="9" text-anchor="middle">Bäckerei</text>
      <rect x="184" y="176" width="40" height="124" fill="#34322d"/><text x="204" y="292" fill="#7dd3ff" font-size="9" text-anchor="middle">Treppe</text>
      <rect x="226" y="176" width="116" height="34" fill="#24221e"/><rect x="226" y="212" width="116" height="80" fill="#2f3a2f"/><text x="284" y="256" fill="#f0d9b0" font-size="11" text-anchor="middle" font-weight="700">Exerzierplatz</text><text x="284" y="270" fill="#b5aa98" font-size="9" text-anchor="middle">Zwischengeschoss</text>
      <rect x="344" y="176" width="56" height="116" fill="#33302b"/><text x="372" y="214" fill="#f0d9b0" font-size="10" text-anchor="middle" font-weight="700">Zeughaus</text><text x="372" y="270" fill="#f0d9b0" font-size="10" text-anchor="middle" font-weight="700">Hacker-</text><text x="372" y="282" fill="#f0d9b0" font-size="10" text-anchor="middle" font-weight="700">space</text>
      <g fill="#f0d9b0" font-size="10" font-weight="700"><text x="20" y="100">Kommandantur</text><text x="320" y="122">Schwarzmarkt</text></g>
      <circle cx="200" cy="128" r="9" fill="#d8642e"/>
      <use href="#ring" x="190" y="72" style="stroke:#7dd3ff"/><circle cx="190" cy="72" r="11" fill="none" stroke="#7dd3ff" stroke-width="2.5"/>
      <g><use href="#ring" x="50" y="118"/><use href="#ring" x="350" y="150"/><use href="#ring" x="51" y="245"/><use href="#ring" x="143" y="232"/><use href="#ring" x="284" y="285"/><use href="#ring" x="372" y="230"/><use href="#ring" x="372" y="295"/></g>
      <path d="M190 72 L200 128 L50 118 M200 128 L350 150 M200 128 L143 232 M200 128 L204 260" stroke="#b5aa98" stroke-dasharray="3 4" fill="none" opacity=".45"/>
    </g>
    <g transform="translate(0,366)" fill="#b5aa98" font-size="12">
      <text y="0"><tspan fill="#8fd16a">+</tspan> Räume geben jeder Station einen eigenen Ort und Boden (2D-Gefühl).</text>
      <text y="18"><tspan fill="#8fd16a">+</tspan> Daten und Positionen direkt aus 2D (`CST` x/y, Räume).</text>
      <text y="36"><tspan fill="#d8642e">−</tspan> Längste Wege: Feuer → Hackerspace ~25 m (~5 s).</text>
      <text y="54"><tspan fill="#d8642e">−</tspan> Türen und Zwischenwände: Kamera sieht Wände von oben.</text>
    </g>
  </g>

  <!-- ===================== B ===================== -->
  <g transform="translate(440,80)">
    <text fill="#ef9f27" font-size="16" font-weight="700">B · Inselbahnsteig (kompakt)</text>
    <text y="18" fill="#b5aa98" font-size="12">Ein Bahnsteig 56 × 14 m zwischen zwei Gleisen.</text><text y="34" fill="#b5aa98" font-size="12">Stationen als Stände unter den Säulen.</text>
    <g transform="translate(0,44)">
      <rect width="380" height="300" fill="url(#grid)"/>
      <rect x="0" y="40" width="380" height="54" fill="url(#sl)"/>
      <rect x="20" y="58" width="150" height="22" rx="3" fill="#ed9e25" stroke="#1a120c"/><text x="95" y="73" fill="#1a120c" font-size="10" text-anchor="middle" font-weight="700">U-Bahn-Zug</text>
      <rect x="0" y="94" width="380" height="3" fill="#ed9e25"/>
      <rect x="0" y="97" width="380" height="108" fill="#3e3d38"/>
      <rect x="0" y="205" width="380" height="3" fill="#ed9e25"/>
      <rect x="0" y="208" width="380" height="54" fill="url(#sl)"/>
      <g fill="#3f6a4a"><rect x="60" y="148" width="6" height="6"/><rect x="140" y="148" width="6" height="6"/><rect x="236" y="148" width="6" height="6"/><rect x="316" y="148" width="6" height="6"/></g>
      <rect x="168" y="128" width="44" height="46" fill="#34322d" stroke="#7dd3ff" stroke-dasharray="3 3"/><text x="190" y="190" fill="#7dd3ff" font-size="9" text-anchor="middle">Treppe hoch</text>
      <g fill="#5a4636" stroke="#1a120c"><rect x="14" y="104" width="44" height="20"/><rect x="74" y="104" width="44" height="20"/><rect x="250" y="104" width="44" height="20"/><rect x="314" y="104" width="52" height="20"/>
        <rect x="14" y="178" width="44" height="20"/><rect x="74" y="178" width="58" height="20"/><rect x="250" y="178" width="110" height="20"/></g>
      <g fill="#f0d9b0" font-size="9" font-weight="700" text-anchor="middle"><text x="36" y="118">Kommand.</text><text x="96" y="118">Lazarett</text><text x="272" y="118">Imbiss</text><text x="340" y="118">Schwarzm.</text><text x="36" y="192">Zeughaus</text><text x="103" y="192">Hackersp.</text><text x="305" y="192">Exerzierplatz</text></g>
      <circle cx="226" cy="152" r="8" fill="#d8642e"/>
      <circle cx="40" cy="80" r="11" fill="#7dd3ff" fill-opacity=".12" stroke="#7dd3ff" stroke-width="2.5"/>
      <g><use href="#ring" x="36" y="136"/><use href="#ring" x="96" y="136"/><use href="#ring" x="272" y="136"/><use href="#ring" x="340" y="136"/><use href="#ring" x="36" y="166"/><use href="#ring" x="103" y="166"/><use href="#ring" x="305" y="166"/></g>
      <text x="4" y="236" fill="#b5aa98" font-size="9">← S3 nach Köpenick</text><text x="376" y="236" fill="#b5aa98" font-size="9" text-anchor="end">U-Bahn-Linien →</text>
    </g>
    <g transform="translate(0,366)" fill="#b5aa98" font-size="12">
      <text y="0"><tspan fill="#8fd16a">+</tspan> Alles auf ein bis zwei Bildschirmen, kurze Wege (max ~15 m).</text>
      <text y="18"><tspan fill="#8fd16a">+</tspan> Am nächsten am Board: Säulen, Zug, Stände, Licht von der Treppe.</text>
      <text y="36"><tspan fill="#d8642e">−</tspan> Wenig Platz pro Station; Stufe 3 muss in die Höhe statt Breite.</text>
      <text y="54"><tspan fill="#d8642e">−</tspan> Neuer Grundriss, nur Stationen und Kunst aus 2D.</text>
    </g>
  </g>

  <!-- ===================== C ===================== -->
  <g transform="translate(850,80)">
    <text fill="#ef9f27" font-size="16" font-weight="700">C · Gleisvorfeld unter freiem Himmel</text>
    <text y="18" fill="#b5aa98" font-size="12">S-Bahn-Einschnitt mit Brücke (echte Warschauer Str.).</text>
    <text y="34" fill="#b5aa98" font-size="12">Stationen in Waggons, Stellwerk, Containern.</text>
    <g transform="translate(0,44)">
      <rect width="380" height="300" fill="#1a2326"/>
      <rect x="0" y="0" width="380" height="16" fill="#4a4038"/><rect x="0" y="284" width="380" height="16" fill="#4a4038"/>
      <rect x="0" y="16" width="380" height="268" fill="#2b2926"/>
      <g fill="none" stroke="#6a6258" stroke-width="2"><path d="M0 60H380M0 70H380M0 130H380M0 140H380M0 200H380M0 210H380"/></g>
      <rect x="160" y="0" width="56" height="300" fill="#5a5048" opacity=".55"/><text x="188" y="296" fill="#f0d9b0" font-size="9" text-anchor="middle">Warschauer Brücke</text>
      <g stroke="#1a120c"><rect x="14" y="54" width="120" height="22" rx="3" fill="#a7533a"/><rect x="240" y="54" width="70" height="22" rx="2" fill="#5a4636"/><rect x="230" y="124" width="60" height="22" fill="#647872"/><rect x="294" y="124" width="60" height="22" fill="#8f7c45"/><rect x="20" y="226" width="40" height="40" fill="#5a5048"/><rect x="250" y="226" width="110" height="40" fill="#2f3a2f"/><rect x="168" y="150" width="40" height="30" fill="#6a3a2a"/></g>
      <g fill="#f0d9b0" font-size="9" font-weight="700" text-anchor="middle"><text x="74" y="69">S-Bahn-Wagen · Lazarett</text><text x="275" y="69">Güterwagen · Zeughaus</text><text x="260" y="139">Hackersp.</text><text x="324" y="139">Schwarzm.</text><text x="40" y="250">Stellwerk</text><text x="305" y="250">Exerzierplatz</text><text x="188" y="169">Imbiss</text></g>
      <text x="40" y="262" fill="#b5aa98" font-size="8" text-anchor="middle">Kommandantur</text>
      <circle cx="110" cy="170" r="8" fill="#d8642e"/>
      <rect x="0" y="94" width="40" height="22" rx="3" fill="#ed9e25" stroke="#1a120c"/>
      <circle cx="56" cy="104" r="11" fill="#7dd3ff" fill-opacity=".12" stroke="#7dd3ff" stroke-width="2.5"/>
      <g><use href="#ring" x="74" y="92"/><use href="#ring" x="275" y="92"/><use href="#ring" x="260" y="162"/><use href="#ring" x="324" y="162"/><use href="#ring" x="70" y="246"/><use href="#ring" x="305" y="214"/><use href="#ring" x="188" y="196"/></g>
    </g>
    <g transform="translate(0,366)" fill="#b5aa98" font-size="12">
      <text y="0"><tspan fill="#8fd16a">+</tspan> Mondlicht, Himmel, Kontrast zu Tunnel und Bezirk.</text>
      <text y="18"><tspan fill="#8fd16a">+</tspan> Jede Station ein eigenes Objekt (Wagen, Turm).</text>
      <text y="36"><tspan fill="#d8642e">−</tspan> Weicht vom 2D-Konzept ab (unterirdisch).</text>
      <text y="54"><tspan fill="#d8642e">−</tspan> Mehr Bauarbeit: Brücke, Waggons, Stellwerk.</text>
    </g>
  </g>

  <!-- ===================== levels ===================== -->
  <g transform="translate(24,556)">
    <text fill="#ef9f27" font-size="16" font-weight="700">Ausbaustufen sichtbar (für alle Layouts) · Beispiel Zeughaus, Seitenansicht</text>
    <text y="18" fill="#b5aa98" font-size="12">Jede Stufe fügt Bauteile, Licht und Leben hinzu; Stufe 2 bringt die befreite Person (2D-Regel). Gebaut in Code, ein Lichtpool, keine neuen Lichter.</text>
    <g transform="translate(0,40)">
      <!-- L1 -->
      <g>
        <rect width="380" height="200" fill="#151d1f"/><rect y="170" width="380" height="30" fill="#3e3d38"/>
        <rect x="60" y="130" width="110" height="40" fill="#6b4a2c" stroke="#1a120c"/><rect x="70" y="122" width="40" height="8" fill="#5b5f60"/>
        <rect x="200" y="140" width="34" height="30" fill="#8a6a3a" stroke="#1a120c"/><rect x="240" y="150" width="26" height="20" fill="#8a6a3a" stroke="#1a120c"/>
        <circle cx="300" cy="150" r="14" fill="#33373a"/><circle cx="300" cy="150" r="5" fill="#ffb04a" opacity=".6"/>
        <text x="12" y="22" fill="#f0d9b0" font-size="13" font-weight="700">Stufe 1 · Werkbank</text>
        <text x="12" y="40" fill="#b5aa98" font-size="11">Bank, Schraubstock, Kisten, Kerzenlicht</text>
      </g>
      <!-- L2 -->
      <g transform="translate(400,0)">
        <rect width="380" height="200" fill="#151d1f"/><rect y="170" width="380" height="30" fill="#3e3d38"/>
        <rect x="40" y="60" width="300" height="6" fill="#8a8f8c"/><rect x="40" y="60" width="6" height="110" fill="#8a8f8c"/><rect x="334" y="60" width="6" height="110" fill="#8a8f8c"/>
        <rect x="60" y="130" width="110" height="40" fill="#6b4a2c" stroke="#1a120c"/><rect x="70" y="122" width="40" height="8" fill="#5b5f60"/>
        <rect x="60" y="80" width="110" height="36" fill="#3a3632"/><g stroke="#c9c2b0" stroke-width="2"><path d="M70 86v20M82 86v24M94 86v16M106 86v22M118 86v18"/></g>
        <rect x="190" y="110" width="44" height="60" fill="#5b5f60" stroke="#1a120c"/><circle cx="212" cy="128" r="8" fill="#c04a1e"/>
        <ellipse cx="212" cy="66" rx="18" ry="5" fill="#ffd08a" opacity=".8"/><path d="M196 66l16 -10l16 10z" fill="#33373a"/>
        <circle cx="280" cy="140" r="8" fill="#d9b48f"/><rect x="270" y="148" width="20" height="22" fill="#4a5536"/>
        <text x="12" y="22" fill="#f0d9b0" font-size="13" font-weight="700">Stufe 2 · Schmiede + Stirnlampen</text>
        <text x="12" y="40" fill="#b5aa98" font-size="11">Gerüst, Werkzeugwand, Esse glüht, Hängelampe, Mira steht da</text>
      </g>
      <!-- L3 -->
      <g transform="translate(800,0)">
        <rect width="410" height="200" fill="#151d1f"/><rect y="170" width="410" height="30" fill="#3e3d38"/>
        <rect x="30" y="50" width="350" height="6" fill="#8a8f8c"/><rect x="30" y="50" width="6" height="120" fill="#8a8f8c"/><rect x="374" y="50" width="6" height="120" fill="#8a8f8c"/>
        <rect x="70" y="34" width="150" height="18" fill="#1a120c" stroke="#ef9f27"/><text x="145" y="48" fill="#ef9f27" font-size="12" text-anchor="middle" font-weight="700">ZEUGHAUS</text>
        <rect x="50" y="130" width="110" height="40" fill="#6b4a2c" stroke="#1a120c"/>
        <rect x="50" y="70" width="110" height="46" fill="#3a3632"/><g stroke="#c9c2b0" stroke-width="2"><path d="M60 78v28M72 78v32M84 78v20M96 78v30M108 78v26M120 78v30M132 78v22M144 78v28"/></g>
        <rect x="180" y="96" width="60" height="74" fill="#5b5f60" stroke="#1a120c"/><circle cx="210" cy="118" r="11" fill="#ff7a2e"/><circle cx="210" cy="118" r="22" fill="#ff7a2e" opacity=".18"/>
        <rect x="256" y="120" width="30" height="50" fill="#33373a"/><rect x="262" y="104" width="18" height="16" fill="#8a8f8c"/>
        <g fill="#8a8f8c"><rect x="300" y="100" width="4" height="60"/><rect x="314" y="96" width="4" height="64"/><rect x="328" y="102" width="4" height="58"/></g>
        <circle cx="350" cy="140" r="8" fill="#d9b48f"/><rect x="340" y="148" width="20" height="22" fill="#4a5536"/>
        <text x="12" y="22" fill="#f0d9b0" font-size="13" font-weight="700">Stufe 3 · Waffenkammer</text>
        <text x="240" y="22" fill="#b5aa98" font-size="11">Leuchtschild, Amboss,</text><text x="240" y="36" fill="#b5aa98" font-size="11">Waffenständer</text>
      </g>
    </g>
    <text y="268" fill="#b5aa98" font-size="12">Jede der sieben Stationen bekommt so drei Stände (Bühne, Theke, Schild, Arbeitslicht, Person).</text><text y="286" fill="#b5aa98" font-size="12">Lazarett: Liege → Vorhänge + Sani-Kiste → Arzneiregal und OP-Lampe. Imbiss: Kocher → Grill + Gemüsebeet → Theke mit Leuchtschrift.</text>
  </g>
</svg>
