<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1010" viewBox="0 0 1880 1010" font-family="Barlow Condensed, Arial Narrow, sans-serif">
<style>@font-face { font-family: 'Barlow Condensed'; src: url(../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-400-normal.woff2); } @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2); } @font-face { font-family: 'Pirata One'; src: url(../../../node_modules/@fontsource/pirata-one/files/pirata-one-latin-400-normal.woff2); }</style>
<rect width="1880" height="1010" fill="#120d0a"/>
<text x="24" y="40" fill="#ef9f27" font-size="30" font-weight="700">M13b Händler · C · Reiter: Waren · Segen · Verkaufen</text>
<text x="24" y="64" fill="#a8957d" font-size="16">Echtes Späti-Angebot aus src/sim/trade.ts (Xhain, Welle 8, 840 Schrott). Text Deutsch, kurz. Ränder: Rarität; heller Rahmen: Fokus.</text>
<text x="24" y="88" fill="#a8957d" font-size="15">1280 × 720 (PC) · Reiter Waren</text><rect x="23" y="95" width="1026" height="578" fill="none" stroke="#4a3a2e"/><image href="c-reiter-1280x720.webp" x="24" y="96" width="1024" height="576"/>
<text x="1084" y="88" fill="#a8957d" font-size="15">844 × 390 (Handy quer) · Reiter Segen</text><rect x="1083" y="95" width="774" height="359" fill="none" stroke="#4a3a2e"/><image href="c-reiter-844x390.webp" x="1084" y="96" width="772" height="357"/>
<text x="1084" y="482" fill="#a8957d" font-size="15">1280 × 800 (Steam Deck, Pad) · Reiter Verkaufen</text><rect x="1083" y="489" width="774" height="485" fill="none" stroke="#4a3a2e"/><image href="c-reiter-1280x800.webp" x="1084" y="490" width="772" height="483"/>
<text x="24" y="700" fill="#ef9f27" font-size="17" font-weight="700">Aufbau</text><text x="150" y="700" fill="#ead9c0" font-size="17">Reiter wie im Pausenmenü. Waren: Kacheln links, Vergleich rechts (wie Inventar). Segen: zwei große Karten wie die</text><text x="150" y="721" fill="#ead9c0" font-size="17">Segenwahl, rechts deine Segen mit +1 und Tauschen. Verkaufen: Rucksack mit Sammel-Chips.</text><text x="24" y="754" fill="#ef9f27" font-size="17" font-weight="700">Fokus (Deck)</text><text x="150" y="754" fill="#ead9c0" font-size="17">LB/RB wechselt den Reiter (wie im Menü), Steuerkreuz bewegt in den Kacheln, A kauft, Y tauscht, B schließt.</text><text x="24" y="787" fill="#ef9f27" font-size="17" font-weight="700">Stark</text><text x="150" y="787" fill="#ead9c0" font-size="17">Jeder Teil hat Platz, auch am Handy; Segen sehen aus wie die Segenwahl. Am meisten Code aus Inventar und Segenwahl</text><text x="150" y="808" fill="#ead9c0" font-size="17">wiederverwendbar.</text><text x="24" y="841" fill="#ef9f27" font-size="17" font-weight="700">Schwach</text><text x="150" y="841" fill="#ead9c0" font-size="17">Ein Druck mehr zwischen Kaufen und Verkaufen; Segen sind einen Reiter weit weg.</text>
</svg>