<style>@font-face { font-family: 'Barlow Condensed'; src: url(../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-400-normal.woff2); } @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2); } @font-face { font-family: 'Pirata One'; src: url(../../../node_modules/@fontsource/pirata-one/files/pirata-one-latin-400-normal.woff2); }</style>
<rect width="1880" height="1010" fill="#120d0a"/>
<text x="24" y="40" fill="#ef9f27" font-size="30" font-weight="700">M13b Händler · A · Zwei Spalten: Rucksack | Händler</text>
<text x="24" y="64" fill="#a8957d" font-size="16">Echtes Späti-Angebot aus src/sim/trade.ts (Xhain, Welle 8, 840 Schrott). Text Deutsch, kurz. Ränder: Rarität; heller Rahmen: Fokus.</text>
<text x="24" y="88" fill="#a8957d" font-size="15">1280 × 720 (PC)</text><rect x="23" y="95" width="1026" height="578" fill="none" stroke="#4a3a2e"/><image href="a-zwei-spalten-1280x720.webp" x="24" y="96" width="1024" height="576"/>
<text x="1084" y="88" fill="#a8957d" font-size="15">844 × 390 (Handy quer)</text><rect x="1083" y="95" width="774" height="359" fill="none" stroke="#4a3a2e"/><image href="a-zwei-spalten-844x390.webp" x="1084" y="96" width="772" height="357"/>
<text x="1084" y="482" fill="#a8957d" font-size="15">1280 × 800 (Steam Deck, Pad)</text><rect x="1083" y="489" width="774" height="485" fill="none" stroke="#4a3a2e"/><image href="a-zwei-spalten-1280x800.webp" x="1084" y="490" width="772" height="483"/>
<text x="24" y="700" fill="#ef9f27" font-size="17" font-weight="700">Aufbau</text><text x="150" y="700" fill="#ead9c0" font-size="17">Links du: angelegte Teile, Rucksack, gewähltes Teil mit Verkaufen. Rechts der Händler als eine Liste: Waren, Aufsatz,</text><text x="150" y="721" fill="#ead9c0" font-size="17">Segen, Vorräte.</text><text x="24" y="754" fill="#ef9f27" font-size="17" font-weight="700">Fokus (Deck)</text><text x="150" y="754" fill="#ead9c0" font-size="17">Steuerkreuz hoch/runter in der Spalte, links/rechts wechselt die Spalte. A kauft, X verkauft, Y tauscht einen Segen, B</text><text x="150" y="775" fill="#ead9c0" font-size="17">schließt. Rechter Stick scrollt die Liste.</text><text x="24" y="808" fill="#ef9f27" font-size="17" font-weight="700">Stark</text><text x="150" y="808" fill="#ead9c0" font-size="17">Wie Diablo: Rucksack immer sichtbar, Verkaufen und Kaufen ohne Umschalten.</text><text x="24" y="841" fill="#ef9f27" font-size="17" font-weight="700">Schwach</text><text x="150" y="841" fill="#ead9c0" font-size="17">Die Händlerliste ist lang und scrollt; Segen-Karten sind klein. Am Handy eng.</text>
</svg>