<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 960" font-family="Inter, Arial, sans-serif">
  <rect width="1260" height="960" fill="#0e1517"/>
  <text x="24" y="34" fill="#f0d9b0" font-size="20" font-weight="700">M20 Lager A+C · S+U Warschauer Straße · Halle unten, Gleisvorfeld oben, Treppe dazwischen (Beispielwerte)</text>
  <text x="24" y="56" fill="#b5aa98" font-size="13">Draufsicht 10 px = 1 m, 74 × 50 m. Orange Ring: Station · Blau: Abfahrt (Netzplan) · Rot: Lagerfeuer · Grau gestrichelt: Bauplatz (noch nicht freigeschaltet)</text>
  <defs>
    <pattern id="tile" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#4a4842"/><path d="M10 0H0V10" fill="none" stroke="#3a3934" stroke-width="1"/></pattern>
    <pattern id="wtile" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#b3ae9f"/><path d="M6 0H0V6" fill="none" stroke="#9a9588" stroke-width=".8"/></pattern>
    <pattern id="grav" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#2f2c28"/><circle cx="3" cy="4" r="1.2" fill="#3c3833"/><circle cx="9" cy="9" r="1" fill="#25221f"/></pattern>
    <pattern id="sl" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1d1a17"/><rect x="0" y="3" width="8" height="2" fill="#2e2219"/></pattern>
    <g id="ring"><circle r="14" fill="#ef9f27" fill-opacity=".12" stroke="#ef9f27" stroke-width="2.5"/></g>
    <radialGradient id="moon"><stop offset="0" stop-color="#bcd6ff" stop-opacity=".22"/><stop offset="1" stop-color="#bcd6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm"><stop offset="0" stop-color="#ffb060" stop-opacity=".35"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- ================= top view ================= -->
  <g transform="translate(24,76)">
    <rect width="740" height="500" fill="#0a0908"/>
    <!-- INSIDE: hall x0-340 -->
    <rect x="0" y="60" width="340" height="100" fill="url(#sl)"/>
    <g stroke="#6a6258" stroke-width="2"><path d="M0 92H340M0 104H340M0 120H340M0 132H340"/></g>
    <rect x="0" y="56" width="20" height="108" fill="#000"/><text x="24" y="54" fill="#b5aa98" font-size="10">← S3-Tunnel (Ankunft)</text>
    <rect x="40" y="114" width="200" height="26" rx="4" fill="#ed9e25" stroke="#1a120c"/><text x="140" y="131" fill="#1a120c" font-size="11" text-anchor="middle" font-weight="700">U-Bahn-Zug · Bär</text>
    <rect x="0" y="160" width="340" height="4" fill="#ed9e25"/>
    <rect x="0" y="164" width="340" height="140" fill="url(#tile)"/>
    <g fill="#3f6a4a" stroke="#2c4a34"><rect x="66" y="226" width="8" height="8"/><rect x="146" y="226" width="8" height="8"/><rect x="226" y="226" width="8" height="8"/><rect x="306" y="226" width="8" height="8"/></g>
    <!-- Schwarzmarkt stalls under columns -->
    <g stroke="#1a120c"><rect x="176" y="186" width="34" height="18" fill="#7d322d"/><rect x="216" y="186" width="34" height="18" fill="#8f7c45"/><rect x="256" y="186" width="34" height="18" fill="#647872"/><rect x="200" y="252" width="80" height="18" fill="#5a4636"/></g>
    <path d="M176 182 Q 230 196 290 182 M200 248 Q 240 262 280 248" stroke="#ffc890" stroke-width="1.5" stroke-dasharray="2 4" fill="none"/>
    <text x="236" y="222" fill="#f0d9b0" font-size="12" text-anchor="middle" font-weight="700">Schwarzmarkt</text><text x="236" y="236" fill="#b5aa98" font-size="9" text-anchor="middle">Stände, Lichterkette, Lagerkisten</text>
    <!-- rooms south -->
    <rect x="0" y="304" width="340" height="6" fill="#2a2622"/>
    <rect x="10" y="310" width="130" height="130" fill="url(#wtile)"/><rect x="10" y="304" width="40" height="6" fill="url(#wtile)"/>
    <text x="75" y="372" fill="#1a120c" font-size="13" text-anchor="middle" font-weight="700">Lazarett</text><text x="75" y="386" fill="#1a120c" font-size="9" text-anchor="middle">alte Toiletten, weiße Kacheln</text>
    <rect x="150" y="310" width="120" height="110" fill="#6a3a2a"/><g fill="#cbbfa8"><rect x="150" y="310" width="12" height="12"/><rect x="174" y="310" width="12" height="12"/><rect x="198" y="310" width="12" height="12"/><rect x="222" y="310" width="12" height="12"/><rect x="246" y="310" width="12" height="12"/></g>
    <rect x="160" y="300" width="100" height="10" fill="#c9a22a"/>
    <text x="210" y="368" fill="#f0d9b0" font-size="13" text-anchor="middle" font-weight="700">Imbiss</text><text x="210" y="382" fill="#f0d9b0" font-size="9" text-anchor="middle">Bahnhofsbäckerei, Theke zur Halle</text>
    <rect x="280" y="310" width="60" height="190" fill="#1a1816"/><text x="310" y="470" fill="#6a6058" font-size="9" text-anchor="middle">Kiosk</text>
    <!-- STAIRS x340-430, y190-300 -->
    <g>
      <rect x="340" y="190" width="90" height="110" fill="#5f5b55"/>
      <g stroke="#7d786f" stroke-width="3"><path d="M350 190V300M360 190V300M370 190V300M380 190V300M390 190V300M400 190V300M410 190V300M420 190V300"/></g>
      <rect x="340" y="186" width="90" height="4" fill="#8a8f96"/><rect x="340" y="300" width="90" height="4" fill="#8a8f96"/>
      <rect x="340" y="190" width="90" height="110" fill="url(#moon)"/>
      <text x="385" y="320" fill="#7dd3ff" font-size="11" text-anchor="middle" font-weight="700">Treppe +3 m</text><text x="385" y="334" fill="#b5aa98" font-size="9" text-anchor="middle">Mondlicht fällt herein</text>
    </g>
    <rect x="336" y="60" width="6" height="130" fill="#2a2622"/><rect x="336" y="300" width="6" height="200" fill="#2a2622"/>
    <!-- OUTSIDE: yard x430-740 at +3 m -->
    <rect x="430" y="0" width="310" height="500" fill="url(#grav)"/>
    <rect x="430" y="0" width="310" height="500" fill="url(#moon)"/>
    <rect x="342" y="0" width="398" height="30" fill="#4a4038"/><rect x="342" y="470" width="398" height="30" fill="#4a4038"/>
    <text x="560" y="20" fill="#b5aa98" font-size="9" text-anchor="middle">Stützmauer mit Graffiti, oben Brandwände</text>
    <rect x="342" y="30" width="88" height="160" fill="url(#grav)"/><rect x="342" y="304" width="88" height="166" fill="url(#grav)"/>
    <g stroke="#6a6258" stroke-width="2"><path d="M342 70H740M342 82H740M342 400H740M342 412H740"/></g>
    <!-- bridge -->
    <rect x="660" y="0" width="80" height="500" fill="#5a5048" opacity=".6"/>
    <g fill="#0e1517" opacity=".7"><rect x="664" y="110" width="72" height="50" rx="20"/><rect x="664" y="230" width="72" height="50" rx="20"/><rect x="664" y="350" width="72" height="50" rx="20"/></g>
    <text x="700" y="496" fill="#f0d9b0" font-size="10" text-anchor="middle">Warschauer Brücke (über Kopf)</text>
    <!-- Zeughaus freight car -->
    <rect x="450" y="56" width="150" height="36" rx="3" fill="#7d322d" stroke="#1a120c"/><circle cx="620" cy="108" r="12" fill="#ff7a2e" opacity=".8"/><circle cx="620" cy="108" r="30" fill="url(#warm)"/>
    <text x="525" y="78" fill="#f0d9b0" font-size="12" text-anchor="middle" font-weight="700">Zeughaus · Güterwagen</text>
    <!-- Hackerspace under bridge arch -->
    <rect x="664" y="230" width="72" height="50" rx="20" fill="#20363e" stroke="#46f0ff" stroke-width="1.5"/><text x="700" y="258" fill="#46f0ff" font-size="10" text-anchor="middle" font-weight="700">Hackerspace</text><text x="700" y="270" fill="#b5aa98" font-size="8" text-anchor="middle">im Brückenbogen</text>
    <!-- Kommandantur Stellwerk -->
    <rect x="460" y="380" width="70" height="70" fill="#647872" stroke="#1a120c"/><rect x="452" y="372" width="86" height="12" fill="#3a4a4e"/><circle cx="530" cy="388" r="4" fill="#d8ecff"/><line x1="530" y1="388" x2="560" y2="350" stroke="#8a8f8c" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="495" y="420" fill="#f0d9b0" font-size="11" text-anchor="middle" font-weight="700">Kommandantur</text><text x="495" y="433" fill="#f0d9b0" font-size="9" text-anchor="middle">Stellwerk</text>
    <!-- Exerzierplatz -->
    <rect x="560" y="300" width="96" height="90" fill="#2f3a2f" stroke="#8f7c45" stroke-dasharray="4 3"/><g fill="#b8a070"><rect x="566" y="306" width="30" height="8"/><rect x="600" y="306" width="30" height="8"/><rect x="566" y="374" width="40" height="8"/></g><circle cx="636" cy="340" r="9" fill="none" stroke="#c23a2e" stroke-width="3"/>
    <text x="608" y="350" fill="#f0d9b0" font-size="11" text-anchor="middle" font-weight="700">Exerzierplatz</text>
    <!-- campfire -->
    <circle cx="480" cy="245" r="30" fill="url(#warm)"/><circle cx="480" cy="245" r="9" fill="#d8642e"/><text x="480" y="280" fill="#f0d9b0" font-size="10" text-anchor="middle">Lagerfeuer, Sitzkreis</text>
    <!-- rings -->
    <circle cx="120" cy="178" r="14" fill="#7dd3ff" fill-opacity=".12" stroke="#7dd3ff" stroke-width="3"/><text x="120" y="204" fill="#7dd3ff" font-size="10" text-anchor="middle" font-weight="700">Abfahrt</text>
    <g><use href="#ring" x="236" y="282"/><use href="#ring" x="75" y="410"/><use href="#ring" x="210" y="406"/><use href="#ring" x="525" y="116"/><use href="#ring" x="640" y="256"/><use href="#ring" x="495" y="356"/><use href="#ring" x="608" y="286"/></g>
    <!-- hero start -->
    <circle cx="36" cy="178" r="6" fill="#fff"/><text x="44" y="182" fill="#fff" font-size="9">Start</text>
  </g>

  <!-- ================= section ================= -->
  <g transform="translate(790,76)">
    <text fill="#ef9f27" font-size="15" font-weight="700">Schnitt Ost–West (Höhen in m)</text>
    <g transform="translate(0,20)">
      <rect width="446" height="230" fill="#0a0908"/>
      <rect x="220" y="0" width="226" height="150" fill="#14202a"/><circle cx="400" cy="30" r="12" fill="#e8e4d6"/><circle cx="400" cy="30" r="40" fill="url(#moon)"/>
      <rect x="0" y="40" width="200" height="10" fill="#2a2622"/><text x="100" y="34" fill="#b5aa98" font-size="9" text-anchor="middle">Decke (unsichtbar von oben)</text>
      <rect x="0" y="180" width="200" height="50" fill="#3e3d38"/>
      <g fill="#3f6a4a"><rect x="40" y="50" width="8" height="130"/><rect x="120" y="50" width="8" height="130"/></g>
      <rect x="60" y="150" width="50" height="30" fill="#7d322d"/><rect x="140" y="160" width="40" height="20" fill="#6a3a2a"/>
      <path d="M200 180 L200 180 L210 175 L220 170 L230 165 L240 160 L250 155 L250 150" fill="none"/>
      <path d="M200 230 V180 H210 V175 H220 V170 H230 V165 H240 V160 H250 V150 H446 V230 Z" fill="#5f5b55"/>
      <rect x="250" y="150" width="196" height="80" fill="#4a4038"/>
      <rect x="270" y="120" width="60" height="30" fill="#7d322d"/><rect x="340" y="104" width="30" height="46" fill="#647872"/>
      <rect x="380" y="60" width="66" height="14" fill="#5a5048"/><rect x="390" y="74" width="10" height="76" fill="#5a5048"/><rect x="430" y="74" width="10" height="76" fill="#5a5048"/>
      <path d="M200 50 L250 150" stroke="#bcd6ff" stroke-width="18" opacity=".12"/>
      <g fill="#b5aa98" font-size="9"><text x="6" y="196">0 m · Halle</text><text x="256" y="166">+3 m · Gleisvorfeld</text><text x="384" y="56">+9 m Brücke</text><text x="204" y="214">Treppe</text></g>
    </g>
    <g transform="translate(0,276)" font-size="12" fill="#b5aa98">
      <text fill="#f0d9b0" font-weight="700">Drinnen (Halle, 0 m)</text>
      <text y="18">Kacheln, grüne Säulen, Zug, warme Lampen.</text>
      <text y="34">Schwarzmarkt, Lazarett, Imbiss.</text>
      <text y="60" fill="#f0d9b0" font-weight="700">Draußen (Gleisvorfeld, +3 m)</text>
      <text y="78">Kies, alte Gleise, Mond, Regen/Glut, Brücke.</text>
      <text y="94">Zeughaus, Hackerspace, Kommandantur,</text>
      <text y="110">Exerzierplatz, Lagerfeuer.</text>
      <text y="136" fill="#f0d9b0" font-weight="700">Jede Station ein eigener Ort</text>
      <text y="154">Güterwagen, Brückenbogen, Stellwerk,</text>
      <text y="170">Sandsackhof, Kachelraum, Bäckerei, Markt.</text>
      <text y="196" fill="#f0d9b0" font-weight="700">Kosten (Leistung)</text>
      <text y="214">Eine Karte, keine Gegner, gleicher Lichtpool,</text>
      <text y="230">Geometrie gemerged wie Köpenick.</text>
    </g>
  </g>

  <!-- ================= unlock ================= -->
  <g transform="translate(24,610)">
    <text fill="#ef9f27" font-size="16" font-weight="700">Freischalten Schritt für Schritt (Vorschlag)</text>
    <text y="18" fill="#b5aa98" font-size="12">Vor Köpenick: kein Lager, kein Menüpunkt. Nach S3: Lager mit drei Stationen; der Rest sind Bauplätze (Schutt, Absperrband, Schild „Bauplatz“), gebaut für Schrott und Material.</text>
    <g transform="translate(0,40)" font-size="12">
      <rect width="290" height="120" rx="6" fill="#14282b"/>
      <text x="14" y="24" fill="#f0d9b0" font-weight="700">Ankunft (S3 frei)</text>
      <text x="14" y="46" fill="#b5aa98">Kommandantur (Ilse)</text><text x="14" y="64" fill="#b5aa98">Schwarzmarkt (Lager mit 40 Plätzen)</text><text x="14" y="82" fill="#b5aa98">Lazarett (Verband, Molotow)</text>
      <text x="14" y="106" fill="#8fd16a">sofort offen</text>
      <rect x="310" width="290" height="120" rx="6" fill="#14282b"/>
      <text x="324" y="24" fill="#f0d9b0" font-weight="700">Bauplatz bauen</text>
      <text x="324" y="46" fill="#b5aa98">Zeughaus 120 Schrott, 3 Metall</text><text x="324" y="64" fill="#b5aa98">Imbiss 100 Schrott, 2 Stoff</text><text x="324" y="82" fill="#b5aa98">Hackerspace 150 Schrott, 2 Kabel</text><text x="324" y="100" fill="#b5aa98">Exerzierplatz 150 Schrott, 2 Stoff</text>
      <rect x="620" width="290" height="120" rx="6" fill="#14282b"/>
      <text x="634" y="24" fill="#f0d9b0" font-weight="700">Stufe 2 und 3 (wie heute)</text>
      <text x="634" y="46" fill="#b5aa98">Stufe 2: Person befreit + Material</text><text x="634" y="64" fill="#b5aa98">Stufe 3: Köpenick befreit + Material</text><text x="634" y="82" fill="#b5aa98">Jede Stufe sichtbar am Ort (Bauteile,</text><text x="634" y="100" fill="#b5aa98">Licht, Person, Schild)</text>
      <rect x="930" width="280" height="120" rx="6" fill="#14282b"/>
      <text x="944" y="24" fill="#f0d9b0" font-weight="700">Was bleibt ohne Lager?</text>
      <text x="944" y="46" fill="#b5aa98">Köpenick spielen, Beute, Späti-Händler.</text><text x="944" y="64" fill="#b5aa98">Zutaten und Material sammeln sich schon</text><text x="944" y="82" fill="#b5aa98">an und warten aufs Lager.</text>
    </g>
  </g>
</svg>
