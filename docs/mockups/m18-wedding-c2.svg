<text x="50.0" y="855.0" fill="#14121a" font-size="13" font-weight="700" text-anchor="middle" >1</text>
<text x="68.0" y="855.0" fill="#ffd24a" font-size="14.5" font-weight="400" text-anchor="start" >Leopoldkiez: Wochenmarkt (2), Müllerstraße (3), im Magendoktor (3) · Boss „Der Stammgast“ auf dem Nettelbeckplatz</text>
<circle cx="50" cy="874.0" r="10" fill="#ffd24a"/>
