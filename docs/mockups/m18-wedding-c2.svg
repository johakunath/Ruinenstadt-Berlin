<text x="1366.0" y="618.0" fill="#c8ccc8" font-size="12.5" font-weight="400" text-anchor="middle" >Südwand zur Kamera: kniehoch, Dach und obere Wände blenden aus (wie beim Späti)</text>
<text x="1668.0" y="170.0" fill="#c8ccc8" font-size="13" font-weight="600" text-anchor="start" >22 × 17 m innen (Spielmaß)</text>
<text x="1668.0" y="200.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >· Gegner: Zecher (Zeitlose als betrunkene</text>
<text x="1668.0" y="218.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Gäste), 3 Wellen, höchstens 6 gleichzeitig.</text>
<text x="1668.0" y="242.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >· Grün: drei schlafen am Tisch und wachen auf,</text>
<text x="1668.0" y="260.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >wenn der Held nah kommt (vorhandene „Wachen“).</text>
<text x="1668.0" y="284.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >· Außen nach Foto: ockergelber Putz, rotes</text>
<text x="1668.0" y="302.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Leuchtschild mit weißer Frakturschrift,</text>
<text x="1668.0" y="320.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Leuchtkasten „Tag u. Nacht“, beklebte Tür,</text>
<text x="1668.0" y="338.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Wandbild Nachtwächter mit Laterne, rote</text>
<text x="1668.0" y="356.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Schirme, Stehfass.</text>
<text x="1668.0" y="380.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >· Innen: kein Foto gefunden. Aus</text>
<text x="1668.0" y="398.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Presseberichten: Jukebox, Billard,</text>
<text x="1668.0" y="416.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Spielautomaten, Dartscheibe. Tresen,</text>
<text x="1668.0" y="434.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Rückbuffet und Stammtisch sind typische</text>
<text x="1668.0" y="452.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Alt-Berliner Kneipe (Annahme).</text>
<text x="1668.0" y="476.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >· Das echte Haus steht am Südrand des Platzes,</text>
<text x="1668.0" y="494.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >also zwischen Kamera und Platz: das Schild</text>
<text x="1668.0" y="512.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >sitzt zusätzlich an der Dachkante, die echte</text>
<text x="1668.0" y="530.0" fill="#c8ccc8" font-size="13.5" font-weight="400" text-anchor="start" >Front zeigt die Enthüllungskamera.</text>
</svg>