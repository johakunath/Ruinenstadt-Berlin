<text x="68.0" y="879.0" fill="#ffd24a" font-size="14.5" font-weight="400" text-anchor="start" >Panke: Uferterrasse (3) · Boss „Das Hauptgericht“ vor dem Amtsgericht</text>
<circle cx="50" cy="898.0" r="10" fill="#ffd24a"/>
<text x="50.0" y="903.0" fill="#14121a" font-size="13" font-weight="700" text-anchor="middle" >3</text>
<text x="68.0" y="903.0" fill="#ffd24a" font-size="14.5" font-weight="400" text-anchor="start" >Gesundbrunnen &amp; Humboldthain: Badstraße (3), Rosengarten (3), Humboldthöhe (2, ruhig) · Boss „Der Ewige Bauherr“ vor dem Beamtentor</text>
<circle cx="50" cy="922.0" r="10" fill="#ffd24a"/>
<text x="50.0" y="927.0" fill="#14121a" font-size="13" font-weight="700" text-anchor="middle" >4</text>
<text x="68.0" y="927.0" fill="#ffd24a" font-size="14.5" font-weight="400" text-anchor="start" >Das ewige Fest: Lange Tafel im Werkhof (3) · Sultan Nimmersatt im Hochzeitspalast</text>
<text x="40.0" y="959.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Geändert gegenüber C im ersten Mockup: der Nordbogen (Uferhallen, Luisenbad) und der Boss am Bahnhof Gesundbrunnen entfallen, dafür der Magendoktor am</text>
<text x="40.0" y="978.0" fill="#c8ccc8" font-size="14.5" font-weight="400" text-anchor="start" >Nettelbeckplatz und „Das Hauptgericht“ vor dem Amtsgericht. Nur 8 Sehenswürdigkeiten, 2 Nebenwege. Die beiden dunklen Ecken werden nicht bebaut.</text>
<text x="1080.0" y="124.0" fill="#f0a030" font-size="20" font-weight="700" text-anchor="start" >Zum Magendoktor · begehbar (Grundriss, Norden oben, Kamera blickt von Süden)</text>
