<text x="40.0" y="827.0" fill="#7ff0e0" font-size="15" font-weight="700" text-anchor="start" >Start U Leopoldplatz · Karte 335 × 230 m (40 % weniger Fläche als Mitte, 20 % weniger als Köpenick) · Route ≈ 740 m · 8 Kämpfe + 4 Bosse, 22 Wellen · keine Straße doppelt</text>
