<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a1d" />
    <title>Ruinenstadt Berlin</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hurt"></div>

    <div id="hud" hidden>
      <div class="hp" aria-label="Leben"><div id="hp-fill"></div></div>
      <div class="kills">Erledigt <b id="kills">0</b></div>
      <div id="objective" hidden><span id="obj-arrow">➤</span><span id="obj-text"></span></div>
      <button id="map-btn" type="button" aria-label="Karte" hidden>Karte</button>
      <button id="inventory-btn" type="button" aria-label="Inventar">Inventar</button>
      <button id="menu-btn" type="button" aria-label="Optionen">☰</button>
    </div>
    <canvas id="minimap" hidden aria-label="Minikarte"></canvas>
    <div id="edges"></div>
    <div id="bossbar" hidden><span id="boss-name"></span><div class="bar"><div id="boss-fill"></div></div></div>
    <div id="banner" hidden><b id="banner-title"></b><span id="banner-sub"></span></div>

    <div id="karte" class="overlay" hidden>
      <div class="panel wide">
        <button id="x-karte" type="button" class="x-btn" aria-label="Schließen">×</button>
        <div id="karte-svg"></div>
        <button id="close-karte" type="button" class="primary">Weiter</button>
      </div>
    </div>

    <div id="won" class="overlay" hidden>
      <div class="panel">
        <h2>Köpenick befreit</h2>
        <p class="sub">Erledigt: <b id="won-kills">0</b></p>
        <button id="again" type="button" class="primary">Nochmal</button>
      </div>
    </div>

    <div id="touch" hidden>
      <div id="stick-zone"></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="btn-dodge" type="button">Rolle</button>
      <button id="btn-attack" type="button">Schlag</button>
    </div>

    <div id="title" class="overlay">
      <div class="panel">
        <h1>Ruinenstadt<span>Berlin</span></h1>
        <p class="sub" id="title-sub">Köpenick bei Nacht</p>
        <button id="play" type="button" class="primary" disabled>Spielen</button>
        <button id="open-options" type="button">Optionen</button>
        <p id="loading">Lädt …</p>
        <p class="keys">WASD laufen · Maus oder J schlagen · Leertaste rollen<br />Controller: Stick · X schlagen · A rollen</p>
      </div>
    </div>

    <div id="dead" class="overlay" hidden>
      <div class="panel">
        <h2>Gefallen</h2>
        <p class="sub">Erledigt: <b id="dead-kills">0</b></p>
        <button id="retry" type="button" class="primary">Nochmal</button>
        <p class="sub" id="retry-hint" hidden></p>
      </div>
    </div>

    <div id="options" class="overlay" hidden>
      <div class="panel">
        <h2>Optionen</h2>
        <h3>Grafik</h3>
        <div id="opt-profile" class="choices"></div>
        <label class="row">Musik <input id="opt-music" type="checkbox" /></label>
        <label class="row">Lautstärke <input id="opt-volume" type="range" min="0" max="100" /></label>
        <label class="row">Vibration <input id="opt-rumble" type="checkbox" /></label>
        <label class="row">Leistungsanzeige <input id="opt-perf" type="checkbox" /></label>
        <label class="row">Spieldaten senden <input id="opt-telemetry" type="checkbox" /></label>
        <button id="close-options" type="button" class="primary">Weiter</button>
      </div>
    </div>

    <pre id="perf" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
