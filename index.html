<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#17110d" />
    <title>Ruinenstadt Berlin</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hurt"></div>

    <div id="hud" hidden>
      <div class="hp" aria-label="Leben"><div id="hp-fill"></div></div>
      <div class="kills">Erledigt <b id="kills">0</b></div>
      <div id="objective" hidden><span id="obj-arrow">➤</span><span id="obj-text"></span></div>
      <button id="menu-btn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></button>
    </div>
    <canvas id="minimap" hidden aria-label="Minikarte"></canvas>
    <div id="edges"></div>
    <div id="bossbar" hidden><span id="boss-name"></span><div class="bar"><div id="boss-fill"></div></div></div>
    <div id="loot-ui"></div>
    <div id="toast" hidden></div>
    <button id="loot-chip" type="button" hidden>Beute: <b id="loot-n">0</b> · Weiterziehen<span id="loot-pad" hidden> (Select)</span></button>
    <div id="banner" hidden><b id="banner-title"></b><span id="banner-sub"></span></div>

    <div id="lootwarn" class="overlay" hidden>
      <div class="panel">
        <h2>Wertvolle Beute liegt noch hier</h2>
        <button id="loot-find" type="button" class="primary">Beute suchen</button>
        <button id="loot-leave" type="button">Weiterziehen</button>
      </div>
    </div>

    <div id="won" class="overlay" hidden>
      <div class="panel">
        <h2 id="won-title">Köpenick befreit</h2>
        <p class="sub">Der Bezirk atmet wieder.</p>
        <b id="won-kills" hidden>0</b><div class="end-stats" id="won-stats"></div>
        <button id="won-explore" type="button" class="primary">Weiter erkunden</button>
        <button id="won-tunnel" type="button" hidden><b>In den S3-Tunnel</b><small>Richtung Warschauer Straße</small></button>
        <button id="won-endless" type="button">Endlos kämpfen</button>
        <button id="again" type="button">Nochmal</button>
        <button id="won-camp" type="button">Ins Lager</button>
      </div>
    </div>

    <div id="touch" hidden>
      <div id="stick-zone"></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="btn-dodge" type="button">Rolle</button>
      <button id="btn-attack" type="button">Schlag</button>
    </div>

    <!-- U3 start screen, built by src/ui/start.ts before the game loads. -->
    <div id="title" class="overlay"></div>

    <div id="dead" class="overlay" hidden>
      <div class="panel">
        <h2>Gefallen</h2>
        <p class="sub" id="dead-sub">Die Ruinen behalten dich heute Nacht.</p>
        <b id="dead-kills" hidden>0</b><div class="end-stats" id="dead-stats"></div>
        <button id="retry" type="button" class="primary">Nochmal</button>
        <p class="sub" id="retry-hint" hidden></p>
        <button id="dead-camp" type="button">Ins Lager</button>
      </div>
    </div>

    <!-- U3 fullscreen button, top right left of the pause button or the × of a menu. -->
    <button id="fsb" type="button" aria-label="Vollbild" hidden></button>
    <pre id="perf" hidden></pre>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
